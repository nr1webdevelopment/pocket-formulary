eléfono; la oficina central de SFAF es el +1 415 487 3000.","No public phone number in the source list.":"La lista de origen no da un teléfono público.","Non-nucleoside reverse transcriptase inhibitor used in combination regimens.":"Inhibidor de la transcriptasa inversa no análogo de nucleósidos usado en combinaciones.","Non-nucleoside reverse transcriptase inhibitor.":"Inhibidor de la transcriptasa inversa no análogo de nucleósidos.","Non-nucleoside reverse transcriptase inhibitor; also used as oral lead-in for Cabenuva.":"Inhibidor de la transcriptasa inversa no análogo de nucleósidos; también se usa como inicio oral de Cabenuva.","Non-nucleoside reverse transcriptase inhibitors (NNRTIs)":"Inhibidores de la transcriptasa inversa no análogos de nucleósidos (INNTI/NNRTI)","Non-profit teaching hospital. HIV and diabetes services aren't described in the source; confirm.":"Hospital universitario sin ánimo de lucro. La fuente no describe sus servicios de VIH y diabetes; confírmalo.","Non-stimulant":"No estimulante","Non-stimulant option for children 6 and older and adults.":"Opción no estimulante para niños de 6 años o más y adultos.","Non-stimulant that can be used alone or added to a stimulant.":"No estimulante que puede usarse solo o añadido a un estimulante.","Norepinephrine, dopamine and serotonin reuptake inhibitor (NDSRI)":"Inhibidor de la recaptación de noradrenalina, dopamina y serotonina (NDSRI)","North Bangkok":"Bangkok norte","North Thonburi":"Thonburi norte","Northeast Valley Health Corporation":"Northeast Valley Health Corporation","Northeast Valley Health Corporation — Van Nuys":"Northeast Valley Health Corporation — Van Nuys","Not controlled":"No controlada","Not recommended for people with heart failure.":"No se recomienda en personas con insuficiencia cardíaca.","Nucleoside reverse transcriptase inhibitor used as part of a combination regimen.":"Inhibidor de la transcriptasa inversa análogo de nucleósidos usado dentro de una combinación.","Nucleoside reverse transcriptase inhibitor widely used in combination regimens.":"Inhibidor de la transcriptasa inversa análogo de nucleósidos muy usado en combinaciones.","Nucleoside reverse transcriptase inhibitor; also a component of many combination pills.":"Inhibidor de la transcriptasa inversa análogo de nucleósidos; también forma parte de muchas pastillas combinadas.","Nucleoside reverse transcriptase inhibitors (NRTIs)":"Inhibidores de la transcriptasa inversa análogos de nucleósidos (INTI/NRTI)","Nucleotide reverse transcriptase inhibitor; also approved for chronic hepatitis B.":"Inhibidor de la transcriptasa inversa análogo de nucleótidos; también aprobado para la hepatitis B crónica.","OB-GYN outpatient, 3rd Floor, Anusorn 100 Years Building":"Consulta externa de ginecología y obstetricia, planta 3, edificio Anusorn 100 Years","Offered free rapid HIV testing during the state detection campaign (14 Nov–5 Dec 2025). Ask whether testing is available year-round.":"Ofreció pruebas rápidas de VIH gratis durante la campaña estatal de detección (14 nov.–5 dic. 2025). Pregunta si hay pruebas todo el año.","Older third-party directories list a Patpong Road address; SWING's own site lists Silom 64.":"Directorios antiguos de terceros dan una dirección en Patpong Road; la web de SWING indica Silom 64.","Once daily":"Una vez al día","Once daily (at bedtime)":"Una vez al día (al acostarse)","Once daily (before first meal)":"Una vez al día (antes de la primera comida)","Once daily (empty stomach, at bedtime)":"Una vez al día (en ayunas, al acostarse)","Once daily (evening)":"Una vez al día (por la noche)","Once daily (flexible timing)":"Una vez al día (horario flexible)","Once daily (morning)":"Una vez al día (por la mañana)","Once daily (morning, with food)":"Una vez al día (por la mañana, con alimento)","Once daily (short oral lead-in)":"Una vez al día (breve inicio oral)","Once daily (twice daily in some cases)":"Una vez al día (dos veces en algunos casos)","Once daily (two tablets)":"Una vez al día (dos tabletas)","Once daily (with a meal)":"Una vez al día (con una comida)","Once daily (with food)":"Una vez al día (con alimento)","Once daily (worn up to 9 hours)":"Una vez al día (se lleva hasta 9 horas)","Once daily for 14 days (one course)":"Una vez al día durante 14 días (un ciclo)","Once daily with breakfast":"Una vez al día con el desayuno","Once daily, 30 minutes before first food":"Una vez al día, 30 minutos antes del primer alimento","Once daily, within an hour before the first meal":"Una vez al día, en la hora previa a la primera comida","Once or twice daily":"Una o dos veces al día","Once or twice daily (as booster)":"Una o dos veces al día (como potenciador)","Once or twice daily (with food and a booster)":"Una o dos veces al día (con alimento y un potenciador)","Once or twice daily before meals":"Una o dos veces al día antes de las comidas","Once or twice daily with meals":"Una o dos veces al día con las comidas","Once weekly":"Una vez a la semana","Once-daily sulfonylurea that boosts insulin release.":"Sulfonilurea de una vez al día que aumenta la liberación de insulina.","Once-weekly GLP-1 injection that lowers blood sugar and supports weight loss.":"Inyección semanal de GLP-1 que baja la glucosa y ayuda a perder peso.","Once-weekly GLP-1 injection.":"Inyección semanal de GLP-1.","Once-weekly basal insulin":"Insulina basal semanal","One dose as needed for severe low blood sugar":"Una dosis cuando se necesite por hipoglucemia grave","One of the first fixed-dose HIV combination pills.":"Una de las primeras pastillas combinadas de dosis fija contra el VIH.","One of the oldest HIV clinics in the US. Offers HIV care including long-acting injectable treatment; PrEP injections at The Lobby (HAP clinic). Public insurance, uninsured and undocumented patients.":"Una de las clínicas de VIH más antiguas de EE. UU. Atención del VIH, incluido tratamiento inyectable de acción prolongada; inyecciones de PrEP en The Lobby (clínica HAP). Pacientes con seguro público, sin seguro o indocumentados.","Only one public child psychiatry service is listed so far. Ask a local doctor which ADHD medicines are approved in Mainland China.":"Por ahora solo hay un servicio público de psiquiatría infantil. Pregunta a un médico local qué medicamentos para el TDAH están aprobados en China continental.","Open daily; doctor consultations by appointment only. Phone lines 08:00–20:00.":"Abierto todos los días; consultas médicas solo con cita. Teléfono de 08:00 a 20:00.","Opened December 2022 as the first specialised HIV/STI centre for the Guadalajara metropolitan area: testing, PrEP and PEP, antiretroviral pharmacy, counselling, psychology, dental care. Public service; confirm cost.":"Abrió en diciembre de 2022 como el primer centro especializado en VIH/ITS del área metropolitana de Guadalajara: pruebas, PrEP y PEP, farmacia de antirretrovirales, consejería, psicología y odontología. Servicio público; confirma el costo.","Opened December 2023. AIDS Counselling and Testing Service, a Therapeutic Prevention Clinic giving preventive treatment after possible exposure to HIV or hepatitis, and The Commons: one-stop HIV, hepatitis and STI screening for higher-risk groups.":"Abrió en diciembre de 2023. Servicio de Consejería y Prueba del Sida, una Clínica de Prevención Terapéutica que da tratamiento preventivo tras una posible exposición al VIH o a la hepatitis, y The Commons: cribado integral de VIH, hepatitis e ITS para grupos de mayor riesgo.","Oral":"Oral","Oral + Injection":"Oral + inyección","Oral / IV":"Oral / IV","Oral cabotegravir used as an optional lead-in before Cabenuva or Apretude injections.":"Cabotegravir oral usado como inicio opcional antes de las inyecciones de Cabenuva o Apretude.","Oral: DPP-4 inhibitor":"Oral: inhibidor de DPP-4","Oral: SGLT2 inhibitor":"Oral: inhibidor de SGLT2","Oral: biguanide":"Oral: biguanida","Oral: sulfonylurea":"Oral: sulfonilurea","Oral: thiazolidinedione":"Oral: tiazolidinediona","Organisation for female sex workers, listed by AIDS Concern as an HIV testing location.":"Organización para trabajadoras sexuales que AIDS Concern incluye como punto de prueba del VIH.","Other":"Otros","Outpatient and inpatient diabetes care with a multidisciplinary diabetes care team and diabetes health education.":"Atención ambulatoria y hospitalaria de la diabetes con un equipo multidisciplinar y educación sobre diabetes.","Outpatient assessment, diagnosis and treatment of ADHD for under-18s, a 25-bed inpatient ward, and ADHD parent education classes (a national ADHD health education base).":"Evaluación, diagnóstico y tratamiento ambulatorio del TDAH para menores de 18, una planta de hospitalización de 25 camas y clases para padres sobre TDAH (centro nacional de educación sanitaria sobre TDAH).","Outpatient clinic, 1st Floor, HRH Princess Mahachakri Building (confirm floor)":"Consulta externa, planta 1, edificio HRH Princess Mahachakri (confirma la planta)","PEP has to start within 72 hours. Go to a clinic that lists PEP or a hospital emergency department. The city's BKK Pride Clinic network lists PrEP and PEP as free.":"La PEP debe empezar en las primeras 72 horas. Acude a una clínica que ofrezca PEP o a urgencias de un hospital. La red BKK Pride Clinic de la ciudad ofrece PrEP y PEP gratis.","PI":"IP","Pacoima Health Center — Sexual Health Clinic":"Pacoima Health Center — Clínica de Salud Sexual","Paediatric clinic; scope includes attention and behavioural disorders including ADHD. Medication not mentioned.":"Consulta pediátrica; atiende trastornos de atención y conducta, incluido el TDAH. No menciona medicación.","Part of Taiwan CDC's one-stop anonymous rapid HIV screening (2019) and one of three Taipei hospitals named for the city PrEP subsidy (2021). Non-occupational PEP in Taiwan is self-paid (about NT$30,000) at a hospital infectious-disease clinic that offers it; start within 72 hours.":"Participa en el cribado rápido y anónimo del VIH de los CDC de Taiwán (2019) y es uno de los tres hospitales de Taipéi citados para el subsidio municipal de PrEP (2021). En Taiwán la PEP no ocupacional se paga de forma privada (unos NT$30.000) en la consulta de enfermedades infecciosas de un hospital que la ofrezca; hay que empezar en 72 horas.","Pediatric dispersible formulation of dolutegravir.":"Formulación pediátrica dispersable de dolutegravir.","Pediatric dispersible formulation of rilpivirine.":"Formulación pediátrica dispersable de rilpivirina.","Pediatric dispersible version of Triumeq.":"Versión pediátrica dispersable de Triumeq.","Pediatric formulation":"Formulación pediátrica","Pediatric-dose version of Prezcobix.":"Versión en dosis pediátrica de Prezcobix.","Peer-led screening for HIV, syphilis and hepatitis B and C, and PrEP counselling by appointment, aimed at migrants and sex workers.":"Cribado de VIH, sífilis y hepatitis B y C realizado por pares, y asesoramiento sobre PrEP con cita, dirigido a migrantes y trabajadoras/es sexuales.","Per HHS guidelines, used as a PK enhancer rather than as an active antiretroviral.":"Según las guías del HHS, se usa como potenciador farmacocinético y no como antirretroviral activo.","Pharmacokinetic Enhancer":"Potenciador farmacocinético","Pharmacokinetic enhancers":"Potenciadores farmacocinéticos","Phone also works on WhatsApp.":"El teléfono también funciona por WhatsApp.","Portugal":"Portugal","Post-Attachment Inhibitor":"Inhibidor posunión","Post-attachment inhibitors":"Inhibidores posunión","PrEP":"PrEP","PrEP and HIV treatment for people experiencing or at risk of homelessness. Uninsured, undocumented and public insurance.":"PrEP y tratamiento del VIH para personas sin hogar o en riesgo de estarlo. Sin seguro, indocumentadas y con seguro público.","PrEP and HIV treatment including long-acting injections. For patients assigned to this clinic by their public insurance plan; also serves undocumented people.":"PrEP y tratamiento del VIH, incluidas inyecciones de acción prolongada. Para pacientes asignados a esta clínica por su seguro público; también atiende a personas indocumentadas.","PrEP indication excludes people at risk through receptive vaginal sex.":"La indicación de PrEP excluye a quienes se exponen por sexo vaginal receptivo.","PrEP is prescribed at public clinics (DSC, NCID, NUH) and private GPs. Around 2022, guides quoted S$100–200 per visit plus the medicine. PEP must start within 72 hours.":"La PrEP se receta en clínicas públicas (DSC, NCID, NUH) y médicos de cabecera privados. Hacia 2022, las guías hablaban de S$100–200 por consulta más el medicamento. La PEP debe empezar en las primeras 72 horas.","PrEP/STI Clinic — Sete Rios (ULS Santa Maria)":"Consulta de PrEP/ITS — Sete Rios (ULS Santa Maria)","Pribta Clinic":"Clínica Pribta","Primary care, HIV testing, STI testing and treatment, transgender services. Ask whether PrEP/PEP are prescribed on site.":"Atención primaria, prueba del VIH, pruebas y tratamiento de ITS, servicios trans. Pregunta si recetan PrEP/PEP allí.","Princess Margaret Hospital — Infectious Disease Special Medical Clinic":"Hospital Princess Margaret — Clínica Médica Especial de Enfermedades Infecciosas","Private hospital with multilingual staff. For PEP, go straight to the 24-hour emergency department; PEP must start within 72 hours (ideally within 2).":"Hospital privado con personal multilingüe. Para la PEP, ve directamente a urgencias (abiertas 24 h); la PEP debe empezar en 72 horas (idealmente en 2).","Prodrug of the protease inhibitor amprenavir.":"Profármaco del inhibidor de la proteasa amprenavir.","Prodrug the body converts into dextroamphetamine, giving a smooth, long effect.":"Profármaco que el cuerpo convierte en dextroanfetamina, con un efecto suave y prolongado.","Protease inhibitor for treatment-experienced patients with PI resistance.":"Inhibidor de la proteasa para pacientes con tratamiento previo y resistencia a IP.","Protease inhibitor now used almost only as a pharmacokinetic booster for other PIs.":"Inhibidor de la proteasa que hoy se usa casi solo como potenciador farmacocinético de otros IP.","Protease inhibitor with a high barrier to resistance; must be boosted.":"Inhibidor de la proteasa con alta barrera a la resistencia; debe potenciarse.","Protease inhibitor, usually given with a booster (ritonavir or cobicistat).":"Inhibidor de la proteasa que suele darse con un potenciador (ritonavir o cobicistat).","Protease inhibitors (PIs)":"Inhibidores de la proteasa (IP)","Psychiatry clinic, 2nd Floor, 72 Phansa Maharachini Building":"Consulta de psiquiatría, planta 2, edificio 72 Phansa Maharachini","Public ADHD care is through SNS child psychiatry and psychiatry services, by referral from your family doctor.":"La atención pública del TDAH se hace en psiquiatría infantil y psiquiatría del SNS, con derivación de tu médico de familia.","Public anonymous counselling and testing centre (CAD) in a health centre.":"Centro público de asesoramiento y prueba anónima (CAD) dentro de un centro de salud.","Public child ADHD care is mainly by referral from a polyclinic, CHAS GP or the school-linked REACH teams. Consultations and therapy can be subsidised by up to 70%.":"La atención pública del TDAH infantil suele requerir derivación desde una policlínica, un médico de cabecera CHAS o los equipos REACH vinculados a los colegios. Las consultas y terapias pueden tener subsidios de hasta el 70 %.","Public child and adolescent psychiatry is through the Hospital Authority, usually by referral. Ask a local doctor which ADHD medicines are registered in Hong Kong.":"La psiquiatría infantil y juvenil pública depende de la Autoridad Hospitalaria, normalmente con derivación. Pregunta a un médico local qué medicamentos para el TDAH están registrados en Hong Kong.","Public child psychiatry is at the Hospital Civil; ask which ADHD medicines are available in Mexico.":"La psiquiatría infantil pública está en el Hospital Civil; pregunta qué medicamentos para el TDAH hay en México.","Public diabetes care is through Hospital Authority clinics; specialist assessment centres may charge fees.":"La atención pública de la diabetes se da en clínicas de la Autoridad Hospitalaria; los centros especializados de evaluación pueden cobrar.","Public diabetes centres are at the major hospitals; polyclinics manage most routine diabetes care.":"Los centros públicos de diabetes están en los grandes hospitales; las policlínicas llevan la mayor parte de la atención habitual de la diabetes.","Public health centres and the public hospital provide chronic disease care; confirm diabetes services directly.":"Los centros de salud públicos y el hospital público atienden enfermedades crónicas; confirma directamente los servicios de diabetes.","Public hospital HIV clinic. Hospital emergency departments can assess people for PEP within 72 hours of a high-risk exposure (decided case by case).":"Clínica de VIH de hospital público. Las urgencias hospitalarias pueden valorar la PEP en las 72 horas tras una exposición de alto riesgo (caso por caso).","Public service for under-18s, mainly residents of Kowloon West and part of Kowloon Central. ADHD is among the conditions treated. New cases are triaged by senior psychiatric nurses at the Integrated Clinic.":"Servicio público para menores de 18 años, sobre todo residentes de Kowloon Oeste y parte de Kowloon Centro. El TDAH está entre los trastornos que trata. Enfermeras psiquiátricas sénior clasifican los casos nuevos en la Clínica Integrada.","Public sexual health clinic: HIV, hepatitis and STI testing (free with an SNS number), PrEP, STI treatment and contraception. Walk-in and by appointment. In July 2025 GAT reported waits of a year or more for a first PrEP appointment at Lisbon's three hospital PrEP clinics.":"Clínica pública de salud sexual: pruebas de VIH, hepatitis e ITS (gratis con número del SNS), PrEP, tratamiento de ITS y anticoncepción. Sin cita y con cita. En julio de 2025 GAT informó de esperas de un año o más para la primera cita de PrEP en las tres consultas hospitalarias de Lisboa.","Queen Elizabeth Hospital — AIDS Clinical Service":"Hospital Queen Elizabeth — Servicio Clínico del Sida","RSAT Clinic Ramkhamhaeng":"Clínica RSAT Ramkhamhaeng","Rainbow Sky Association of Thailand (RSAT)":"Asociación Rainbow Sky de Tailandia (RSAT)","Rajanagarindra Institute of Child and Adolescent Mental Health":"Instituto Rajanagarindra de Salud Mental Infantil y Juvenil","Rapid HIV testing for gay, bi and other men who have sex with men.":"Prueba rápida del VIH para hombres gais, bisexuales y otros hombres que tienen sexo con hombres.","Rapid-acting insulin analog":"Análogo de insulina de acción rápida","Rapid-acting mealtime insulin.":"Insulina de acción rápida para las comidas.","Ratchaphiphat Hospital":"Hospital Ratchaphiphat","Ratchaphiphat Hospital — BKK Pride Clinic":"Hospital Ratchaphiphat","Receives ADHD referrals from REACH for school-age children. Public child ADHD care in Singapore is mainly by referral (polyclinic, CHAS GP or the school-linked REACH teams); consultations and therapy get subsidies of up to 70%.":"Recibe derivaciones de TDAH de REACH para niños en edad escolar. En Singapur la atención pública del TDAH infantil suele requerir derivación (policlínica, médico CHAS o equipos REACH de los colegios); consultas y terapias con subsidios de hasta el 70 %.","Referral needed.":"Requiere derivación.","Registration: Mon 11:00–15:00, 16:00–19:30; Tue–Thu 07:30–11:00, 12:00–16:00; Fri 07:30–11:00.":"Registro: lun 11:00–15:00, 16:00–19:30; mar–jue 07:30–11:00, 12:00–16:00; vie 07:30–11:00.","Registration: Mon–Wed 07:30–11:00, 12:00–16:00; Thu 11:00–15:00, 16:00–19:30; Fri 07:30–11:00. Screening only Mon, Wed, Fri mornings; full services Tue & Thu.":"Registro: lun–mié 07:30–11:00, 12:00–16:00; jue 11:00–15:00, 16:00–19:30; vie 07:30–11:00. Solo cribado lunes, miércoles y viernes por la mañana; todos los servicios martes y jueves.","Registration: Tue & Thu 07:00–11:30, 12:30–17:30; Wed 09:00–13:30, 14:30–19:30; Fri 07:00–11:30. No clinic Mon.":"Registro: mar y jue 07:00–11:30, 12:30–17:30; mié 09:00–13:30, 14:30–19:30; vie 07:00–11:30. Lunes sin consulta.","Registration: Tue & Wed 07:00–11:30, 12:30–17:30; Thu 09:00–13:30, 14:30–19:30; Fri 07:00–11:30. No clinic Mon.":"Registro: mar y mié 07:00–11:30, 12:30–17:30; jue 09:00–13:30, 14:30–19:30; vie 07:00–11:30. Lunes sin consulta.","Registration: Tue 09:00–13:30, 14:30–19:30; Wed & Thu 07:30–11:30, 12:30–17:30; Fri 07:00–11:30. No clinic Mon.":"Registro: mar 09:00–13:30, 14:30–19:30; mié y jue 07:30–11:30, 12:30–17:30; vie 07:00–11:30. Lunes sin consulta.","Reports from 2023 say Hong Kong has no public PrEP programme, so PrEP is mostly through private doctors and NGOs. For PEP within 72 hours, go to a public hospital emergency department (A&E), where doctors decide case by case, or to a private clinic (about HK$10,000–20,000 for the medicine). Department of Health clinics offer free or low-cost testing.":"Según informes de 2023, Hong Kong no tiene un programa público de PrEP, así que la PrEP se obtiene sobre todo con médicos privados y ONG. Para la PEP en las primeras 72 horas, acude a urgencias (A&E) de un hospital público, donde los médicos deciden caso por caso, o a una clínica privada (unos HK$10.000–20.000 por el medicamento). Las clínicas del Departamento de Salud hacen pruebas gratis o a bajo costo.","Requires a tropism test to confirm CCR5-tropic virus.":"Requiere una prueba de tropismo que confirme virus con tropismo CCR5.","Ruijin Hospital (SJTU)":"Hospital Ruijin (SJTU)","Ruijin Hospital — Shanghai Institute of Endocrine and Metabolic Diseases":"Hospital Ruijin — Instituto de Enfermedades Endocrinas y Metabólicas de Shanghái","SATA CommHealth":"SATA CommHealth","SGLT2 inhibitor":"Inhibidor de SGLT2","SGLT2 inhibitor + DPP-4 inhibitor":"Inhibidor de SGLT2 + inhibidor de DPP-4","SGLT2 inhibitor + biguanide":"Inhibidor de SGLT2 + biguanida","SGLT2 inhibitor also approved for heart failure and chronic kidney disease.":"Inhibidor de SGLT2 también aprobado para la insuficiencia cardíaca y la enfermedad renal crónica.","SGLT2 inhibitor shown to lower the risk of cardiovascular death in type 2 diabetes.":"Inhibidor de SGLT2 que ha demostrado reducir el riesgo de muerte cardiovascular en la diabetes tipo 2.","SGLT2 inhibitor taken once daily.":"Inhibidor de SGLT2 de una vez al día.","SNS":"SNS (Servicio Nacional de Salud de Portugal)","SWING Clinic Bangkok":"Clínica SWING Bangkok","Same-day ART for people who test positive. PEP appears only in page keywords; confirm with clinic.":"Inicio del TAR el mismo día para quien da positivo. La PEP solo aparece en las palabras clave de la página; confírmalo con la clínica.","Same-day ART is listed under the centre's Ratchadamri Clinic; a transgender clinic is also listed. Hours are centre-wide; the site gives no separate Anonymous Clinic hours.":"El inicio de TAR el mismo día figura en la Clínica Ratchadamri del centro; también hay una clínica trans. El horario es del centro en general; la web no da un horario propio de la Clínica Anónima.","Samitivej Children's Hospital — Growth, Endocrine and Diabetes Center":"Hospital Infantil Samitivej — Centro de Crecimiento, Endocrinología y Diabetes","Samitivej International Children's Hospital":"Hospital Infantil Internacional Samitivej","San Francisco":"San Francisco","San Francisco AIDS Foundation":"Fundación del Sida de San Francisco","San Francisco AIDS Foundation — 6th Street Center":"San Francisco AIDS Foundation — Centro de la calle 6","San Francisco AIDS Foundation — Strut (Magnet)":"San Francisco AIDS Foundation — Strut (Magnet)","San Francisco City Clinic":"San Francisco City Clinic","San Francisco City Clinic offers free HIV testing, PrEP, PEP and treatment, including for uninsured and undocumented people. PEP must start within 72 hours.":"San Francisco City Clinic ofrece prueba del VIH, PrEP, PEP y tratamiento gratis, también a personas sin seguro o indocumentadas. La PEP debe empezar en las primeras 72 horas.","San Francisco Community Health Center":"San Francisco Community Health Center","San Francisco Department of Public Health":"Departamento de Salud Pública de San Francisco","Santa Maria Hospital":"Hospital de Santa María","Schedule II":"Lista II (EE. UU.)","Screening only: people with symptoms are referred to a full-service clinic. Free (no copay; insurance billed if you have it). HIV testing, PrEP (pills or monthly injection), PEP within 72 hours, STI testing and treatment, doxy-PEP. Walk-ins welcome; book on +1 213 449 7009. Hours are registration hours.":"Solo cribado: a quien tiene síntomas se le deriva a una clínica con todos los servicios. Gratis (sin copago; se factura al seguro si lo tienes). Prueba del VIH, PrEP (pastillas o inyección mensual), PEP en 72 horas, pruebas y tratamiento de ITS, doxi-PEP. Se aceptan visitas sin cita; reserva en el +1 213 449 7009. El horario es de registro.","Second-generation NNRTI, mainly for treatment-experienced patients.":"INNTI de segunda generación, sobre todo para pacientes con tratamiento previo.","See label":"Ver la ficha técnica","Selective norepinephrine reuptake inhibitor":"Inhibidor selectivo de la recaptación de noradrenalina","Serves children and adults. Insulin pump with glucose sensor has its own treatment page. Foot and Nail Care Clinic is on Building A, 16th Floor (02 011 3322).":"Atiende a niños y adultos. La bomba de insulina con sensor de glucosa tiene su propia página. La clínica de pies y uñas está en el edificio A, planta 16 (02 011 3322).","Service Workers in Group Foundation (SWING)":"Fundación SWING (Service Workers in Group)","Services (HIV/TB/STI testing and treatment, free PrEP and PEP, hormone care) are listed for the BKK Pride Clinic network as a whole, not per site. Confirm what this site offers.":"Los servicios (prueba y tratamiento de VIH/TB/ITS, PrEP y PEP gratis, atención hormonal) se indican para toda la red BKK Pride Clinic, no para cada sede. Confirma qué ofrece esta sede.","Sexual health appointments Tue & Thu 12:30, 14:00, 17:00, 18:00; Sat 09:00, 11:00, 14:00, 15:30 (per UCSF trans guide; confirm).":"Citas de salud sexual mar y jue 12:30, 14:00, 17:00, 18:00; sáb 09:00, 11:00, 14:00, 15:30 (según la guía trans de UCSF; confirma).","Sexual health services by online appointment.":"Servicios de salud sexual con cita en línea.","Shanghai":"Shanghái","Shanghai Mental Health Center (SJTU School of Medicine)":"Centro de Salud Mental de Shanghái (Facultad de Medicina de la SJTU)","Shanghai Mental Health Center — Child and Adolescent Psychiatry":"Centro de Salud Mental de Shanghái — Psiquiatría Infantil y Juvenil","Shanghai Municipal Health Commission":"Comisión Municipal de Salud de Shanghái","Shanghai Public Health Clinical Center":"Centro Clínico de Salud Pública de Shanghái","Shanghai Qingai":"Shanghai Qingai","Shanghai Qingai Dermatology Clinic":"Clínica Dermatológica Qingai de Shanghái","Shanghai Qingai Health Promotion Center":"Centro de Promoción de la Salud Qingai de Shanghái","Shanghai Sixth People's Hospital (SJTU)":"Sexto Hospital Popular de Shanghái (SJTU)","Shanghai Sixth People's Hospital — Endocrinology & Metabolism (Shanghai Diabetes Institute)":"Sexto Hospital Popular de Shanghái — Endocrinología y Metabolismo (Instituto de Diabetes de Shanghái)","Shanghai United Family Hospital (Changning)":"Shanghai United Family Hospital (Changning)","Shanghai has more than 200 free HIV voluntary counselling and testing (VCT) sites. Find them through the city's official VCT finder or the 上海疾控 WeChat account. PEP must start within 72 hours.":"Shanghái tiene más de 200 puntos gratuitos de asesoramiento y prueba voluntaria del VIH (VCT). Búscalos en el buscador oficial de la ciudad o en la cuenta de WeChat 上海疾控. La PEP debe empezar en las primeras 72 horas.","Short-acting dexmethylphenidate, the more active half of the methylphenidate molecule.":"Dexmetilfenidato de acción corta, la mitad más activa de la molécula de metilfenidato.","Short-acting human insulin":"Insulina humana de acción corta","Short-acting methylphenidate; one of the oldest ADHD medicines still in use.":"Metilfenidato de acción corta; uno de los medicamentos para el TDAH más antiguos aún en uso.","Short-acting mix of four amphetamine salts.":"Mezcla de acción corta de cuatro sales de anfetamina.","Short-acting racemic amphetamine.":"Anfetamina racémica de acción corta.","Should be tapered, not stopped suddenly.":"Debe retirarse poco a poco, no suspenderse de golpe.","Singapore":"Singapur","Singapore General Hospital (SingHealth)":"Hospital General de Singapur (SingHealth)","Singapore General Hospital — Diabetes & Metabolism Centre":"Hospital General de Singapur — Centro de Diabetes y Metabolismo","Singapore's national HIV treatment centre (holistic HIV care services) and PrEP Care Clinic. Around 2022, guides quoted S$100–200 per consultation, with branded PrEP at about S$300–400 per month at pharmacies; generic PrEP can be bought online with a prescription.":"Centro nacional de tratamiento del VIH de Singapur (atención integral del VIH) y clínica de PrEP. Hacia 2022 las guías hablaban de S$100–200 por consulta y de S$300–400 al mes por la PrEP de marca en farmacias; la PrEP genérica se puede comprar en línea con receta.","Singapore's public specialist clinic for sexually transmitted infections, with subsidised care. New patients book first. Listed as a PrEP provider. Around 2022, guides quoted S$100–200 per consultation, with branded PrEP at about S$300–400 per month at pharmacies; generic PrEP can be bought online with a prescription.":"Clínica pública especializada en ITS de Singapur, con atención subvencionada. Los pacientes nuevos piden cita antes. Figura como proveedora de PrEP. Hacia 2022 las guías hablaban de S$100–200 por consulta y de S$300–400 al mes por la PrEP de marca en farmacias; la PrEP genérica se puede comprar en línea con receta.","Sirindhorn Hospital":"Hospital Sirindhorn","Sirindhorn Hospital — BKK Pride Clinic":"Hospital Sirindhorn","Siriraj Hospital — Paediatric Diabetes (DM) Clinic":"Hospital Siriraj — Clínica de Diabetes Pediátrica (DM)","Site describes ADHD assessment for children, teenagers and adults, and prescribing of stimulants (e.g. methylphenidate) and non-stimulants (e.g. atomoxetine).":"La web describe evaluación del TDAH en niños, adolescentes y adultos, y la prescripción de estimulantes (p. ej., metilfenidato) y no estimulantes (p. ej., atomoxetina).","Site lists PrEP and HIV screening; PEP and sexual health mentioned in description. Hours not published on site.":"La web indica PrEP y cribado del VIH; la descripción menciona PEP y salud sexual. No publica horario.","Site lists counselling, testing and treatment for HIV and other STIs; confirm whether ART is started/dispensed on site.":"La web indica asesoramiento, pruebas y tratamiento del VIH y otras ITS; confirma si se inicia o entrega el TAR allí.","Skin patch":"Parche cutáneo","Social Welfare Bureau, Health Bureau and DSEDJ, Macao SAR":"Instituto de Acción Social, Oficina de Salud y DSEDJ, RAE de Macao","Social security clinic":"Consulta del seguro social","Society of Rehabilitation and Crime Prevention — Yau Ma Tei":"Sociedad de Rehabilitación y Prevención del Delito — Yau Ma Tei","Somdet Chaopraya Institute of Psychiatry":"Instituto de Psiquiatría Somdet Chaopraya","South Bangkok":"Bangkok sur","South Thonburi":"Thonburi sur","Special internal medicine clinic, 2nd Floor":"Consulta especial de medicina interna, planta 2","Specialist centres only so far. Routine diabetes care is also available at public hospitals and BMA public health centres, usually covered by Thai public health insurance.":"Por ahora solo centros especializados. La atención habitual de la diabetes también está disponible en hospitales públicos y centros de salud pública de la BMA, normalmente cubierta por el seguro público de salud tailandés.","Specialist clinic 1, Building 1, 2nd Floor":"Consulta de especialidades 1, edificio 1, planta 2","Specialist diabetes centres usually need a referral and insurance; LA County community clinics provide routine care.":"Los centros especializados en diabetes suelen pedir derivación y seguro; las clínicas comunitarias del Condado de LA dan atención habitual.","St. James Infirmary":"St. James Infirmary","St. John's Community Health":"St. John's Community Health","St. John's Community Health — 23rd Street":"St. John's Community Health — calle 23","St. John's Community Health — 58th Street":"St. John's Community Health — calle 58","Standalone Vemlidy is FDA-approved for chronic hepatitis B, not HIV; TAF is used for HIV inside combination products (e.g. Biktarvy, Descovy).":"Vemlidy por sí solo está aprobado por la FDA para la hepatitis B crónica, no para el VIH; el TAF se usa contra el VIH dentro de productos combinados (p. ej., Biktarvy, Descovy).","Stimulant":"Estimulante","Street address is from DFAT's listing for Siriraj Piyamaharajkarun Hospital on the same Wanglang Road campus.":"La dirección procede de la ficha del DFAT para el Hospital Siriraj Piyamaharajkarun, en el mismo campus de Wanglang Road.","Street address not given on the clinic page.":"La página de la clínica no da la dirección.","Subcutaneous":"Subcutánea","Subcutaneous / IV":"Subcutánea / IV","Subcutaneous injection":"Inyección subcutánea","Subcutaneous injection (with oral initiation)":"Inyección subcutánea (con inicio oral)","Sulfonylurea":"Sulfonilurea","Swallow whole; do not crush or chew.":"Tragar entera; no triturar ni masticar.","Tablet":"Tableta","Tablet (600 mg)":"Tableta (600 mg)","Tablet for oral suspension":"Tableta para suspensión oral","Tablet; capsule":"Tableta; cápsula","Tablet; capsule; syrup; IV infusion":"Tableta; cápsula; jarabe; infusión IV","Tablet; chewable tablet; oral suspension":"Tableta; tableta masticable; suspensión oral","Tablet; extended-release tablet (Glucophage XR)":"Tableta; tableta de liberación prolongada (Glucophage XR)","Tablet; extended-release tablet (Glucotrol XL)":"Tableta; tableta de liberación prolongada (Glucotrol XL)","Tablet; extended-release tablet (Janumet XR)":"Tableta; tableta de liberación prolongada (Janumet XR)","Tablet; extended-release tablet (Synjardy XR)":"Tableta; tableta de liberación prolongada (Synjardy XR)","Tablet; oral powder":"Tableta; polvo oral","Tablet; oral powder; oral solution":"Tableta; polvo oral; solución oral","Tablet; oral solution":"Tableta; solución oral","Tablet; oral suspension":"Tableta; suspensión oral","Tablet; orally disintegrating tablet (Evekeo ODT)":"Tableta; tableta bucodispersable (Evekeo ODT)","Tablet; subcutaneous injection":"Tableta; inyección subcutánea","Taipei":"Taipéi","Taipei City Hospital":"Hospital Municipal de Taipéi","Taipei City Hospital Kunming Branch — HIV Special Clinic":"Hospital Municipal de Taipéi, sede Kunming — Clínica Especial de VIH","Taipei City Hospital Kunming Prevention Center":"Centro de Prevención Kunming del Hospital Municipal de Taipéi","Taipei Veterans General Hospital":"Hospital General de Veteranos de Taipéi","Taipei Veterans General Hospital — Endocrinology & Metabolism":"Hospital General de Veteranos de Taipéi — Endocrinología y Metabolismo","Taipei Veterans General Hospital — HIV services":"Hospital General de Veteranos de Taipéi — Servicios de VIH","Taiwan":"Taiwán","Taiwan CDC subsidises PrEP for eligible people, such as Taiwanese nationals aged 35 or under at high risk and partners of people living with HIV; others can pay for it themselves. Non-occupational PEP is self-paid (about NT$30,000) at hospital infectious-disease clinics. CDC hotline: 1922.":"Los CDC de Taiwán subvencionan la PrEP para quienes cumplen requisitos, como personas de nacionalidad taiwanesa de 35 años o menos con alto riesgo y parejas de personas con VIH; el resto puede pagarla. La PEP no ocupacional se paga de forma privada (unos NT$30.000) en consultas de enfermedades infecciosas de hospitales. Línea de los CDC: 1922.","Taiwan runs a diabetes shared-care network across hospitals and clinics; ask for a certified diabetes educator.":"Taiwán tiene una red de atención compartida de la diabetes entre hospitales y clínicas; pide un educador en diabetes certificado.","Taken in the evening so it starts working on waking the next morning.":"Se toma por la noche para que empiece a hacer efecto al despertar.","Taksin Hospital — Love Care Clinic":"Hospital Taksin — Clínica Love Care","Taksin Hospital — Love Care Clinic — BKK Pride Clinic":"Hospital Taksin — Clínica Love Care","Tangerine Clinic":"Clínica Tangerine","Tarzana Treatment Centers":"Tarzana Treatment Centers","Tarzana Treatment Centers — Reseda":"Tarzana Treatment Centers — Reseda","Teen's Key":"Teen's Key","Temporary building, 1st Floor":"Edificio provisional, planta 1","Tenofovir alafenamide as a standalone tablet.":"Tenofovir alafenamida como tableta única.","Testing 09:00–13:00.":"Pruebas 09:00–13:00.","Testing for HIV, hepatitis A/B/C, syphilis, chlamydia and gonorrhoea.":"Pruebas de VIH, hepatitis A/B/C, sífilis, clamidia y gonorrea.","Testing for HIV, hepatitis B and C and syphilis, plus support for people living with HIV.":"Pruebas de VIH, hepatitis B y C y sífilis, y apoyo a personas con VIH.","Thai Red Cross AIDS and Infectious Diseases Research Centre":"Centro de Investigación del Sida y Enfermedades Infecciosas de la Cruz Roja Tailandesa","Thai Red Cross Anonymous Clinic":"Clínica Anónima de la Cruz Roja Tailandesa","Thailand":"Tailandia","The Boys' and Girls' Clubs Association of Hong Kong":"Asociación de Clubes de Niños y Niñas de Hong Kong","The Chinese University of Hong Kong":"Universidad China de Hong Kong","The Health Bureau has funded NGOs since 2019 for HIV outreach, a hotline, rapid testing and referral; we couldn't find a public list of those sites.":"Desde 2019 la Oficina de Salud financia a ONG para trabajo de calle sobre VIH, una línea de ayuda, pruebas rápidas y derivación; no encontramos una lista pública de esos puntos.","The Hospital Civil endocrinology service runs a diabetes clinic and free screening days.":"El servicio de endocrinología del Hospital Civil tiene una clínica de diabetes y jornadas gratuitas de detección.","The Society of Rehabilitation and Crime Prevention, Hong Kong":"Sociedad de Rehabilitación y Prevención del Delito de Hong Kong","The county directory prints the postcode as 90005; confirm the exact address before visiting.":"El directorio del condado indica el código postal 90005; confirma la dirección exacta antes de ir.","The county directory prints this number as (231) 201-5000 for some sites, which looks like a typo for (213).":"El directorio del condado imprime este número como (231) 201-5000 en algunas sedes, lo que parece un error por (213).","The department's psychiatrists publish guidance on ADHD clinical evaluation in children (interviews, school reports, questionnaires and attention testing). The same page describes methylphenidate as the first-line and only stimulant available in Taiwan; check current availability.":"Los psiquiatras del departamento publican pautas sobre la evaluación clínica del TDAH en niños (entrevistas, informes escolares, cuestionarios y pruebas de atención). La misma página describe el metilfenidato como el estimulante de primera línea y el único disponible en Taiwán; confirma la disponibilidad actual.","The first DPP-4 inhibitor; boosts the body's own incretin hormones.":"El primer inhibidor de DPP-4; potencia las incretinas propias del cuerpo.","The first FDA-approved HIV medicine (1987).":"El primer medicamento contra el VIH aprobado por la FDA (1987).","The first FDA-approved integrase inhibitor.":"El primer inhibidor de la integrasa aprobado por la FDA.","The first GLP-1 medicine in pill form.":"El primer medicamento GLP-1 en pastilla.","The first SGLT2 inhibitor; removes extra glucose through the urine.":"El primer inhibidor de SGLT2; elimina el exceso de glucosa por la orina.","The first complete once-daily single-tablet HIV regimen (2006).":"El primer régimen completo contra el VIH en una sola pastilla diaria (2006).","The first dextroamphetamine skin patch.":"El primer parche cutáneo de dextroanfetamina.","The first fusion inhibitor; blocks HIV from fusing with the CD4 cell membrane.":"El primer inhibidor de la fusión; impide que el VIH se fusione con la membrana de la célula CD4.","The first long-acting basal insulin analog.":"El primer análogo de insulina basal de acción prolongada.","The first medicine made with recombinant DNA technology.":"El primer medicamento fabricado con tecnología de ADN recombinante.","The first medicine that delays the onset of stage 3 type 1 diabetes.":"El primer medicamento que retrasa la aparición de la diabetes tipo 1 en etapa 3.","The first methylphenidate skin patch.":"El primer parche cutáneo de metilfenidato.","The first needle-free emergency treatment for severe low blood sugar.":"El primer tratamiento de emergencia sin aguja para la hipoglucemia grave.","The first non-stimulant approved for ADHD.":"El primer no estimulante aprobado para el TDAH.","The first once-weekly basal insulin, approved March 2026.":"La primera insulina basal semanal, aprobada en marzo de 2026.","The first rapid-acting insulin analog, taken at mealtimes.":"El primer análogo de insulina de acción rápida, para las comidas.","The only inhaled mealtime insulin in the US.":"La única insulina inhalada para las comidas en EE. UU.","The phone number in the source list is the same as Somdet Chaopraya Institute's; confirm.":"El teléfono de la lista de origen es el mismo que el del Instituto Somdet Chaopraya; confírmalo.","The state's specialised HIV and STI centre (CAE) on Calle Gigantes offers testing, PrEP, PEP and treatment. Jalisco health line: +52 33 3823 3220. IMSS members can ask IMSS about PrEP. PEP must start within 72 hours.":"El Centro de Atención Especializado en VIH e ITS (CAE) del estado, en Calle Gigantes, ofrece pruebas, PrEP, PEP y tratamiento. e PrEP (referenciação a quem receite) e grupos de apoio para comunidades latinas.","HIV testing is not named explicitly on the page (PEP requires a negative HIV test).":"A página não menciona expressamente o teste do HIV (a PEP exige um resultado negativo).","HIV testing, PrEP education groups and an evening drop-in space for trans Latinas.":"Teste do HIV, grupos educativos sobre PrEP e um espaço de acolhimento ao fim da tarde para mulheres trans latinas.","HIV treatment including long-acting injections. Public and private insurance, uninsured and undocumented; bring proof of income and residency.":"Tratamento do HIV, incluindo injeções de ação prolongada. Seguro público e privado, sem seguro e sem documentos; leve comprovativo de rendimentos e de residência.","HIV/STI testing by appointment for sex workers.":"Testes de HIV/IST com marcação para trabalhadores do sexo.","HIV/STI testing drop-in: Tue 13:00–17:00; Wed 14:00–19:00; Thu 13:00–19:00; Fri 13:00–17:00; Sat 14:00–17:00 (per UCSF trans guide; confirm).":"Testes de HIV/IST sem marcação: ter 13:00–17:00; qua 14:00–19:00; qui 13:00–19:00; sex 13:00–17:00; sáb 14:00–17:00 (segundo o guia trans da UCSF; confirme).","HLA-B*5701 screening required (contains abacavir).":"Requer rastreio de HLA-B*5701 (contém abacavir).","HLA-B*5701 screening required before starting (hypersensitivity risk).":"É necessário rastreio de HLA-B*5701 antes de iniciar (risco de hipersensibilidade).","Has child and adolescent psychiatry and a neurodevelopment unit. ADHD isn't listed as a named service; confirm.":"Tem psiquiatria da infância e adolescência e uma unidade de neurodesenvolvimento. A PHDA não consta como serviço próprio; confirme.","Health Bureau (Serviços de Saúde), Macao SAR":"Serviços de Saúde, RAE de Macau","Health Centre No. 3":"Centro de Saúde n.º 3","Helps the pancreas release more insulin.":"Ajuda o pâncreas a libertar mais insulina.","Hepatitis B":"Hepatite B","High-dose raltegravir allowing once-daily dosing.":"Raltegra ede do instituto universitário de investigação em HIV (InIVIH).","Listed on the national HIV services map; services not detailed.":"Consta no mapa nacional de serviços de HIV; não detalha serviços.","Listed on the national HIV services map; services not detailed. Confirm what HIV care is offered.":"Consta no mapa nacional de serviços de HIV; não detalha serviços. Confirme que cuidados de HIV oferece.","Lists ADHD among conditions treated for children, adolescents and young adults; offers medication treatments in general.":"Inclui a PHDA entre as condições tratadas em crianças, adolescentes e jovens adultos; oferece tratamentos com medicação em geral.","Location note (floor/room) comes from the Amarin TV article; site list and phones from BMA PR. Opening hours not published — call ahead.":"A localização (piso/sala) vem de um artigo da Amarin TV; a lista de locais e os telefones vêm do gabinete de imprensa da BMA. O horário não é publicado: ligue antes.","Long-acting":"Ação prolongada","Long-acting amphetamine available as a liquid or tablet.":"Anfetamina de ação prolongada disponível em líquido ou comprimido.","Long-acting amphetamine that dissolves in the mouth.":"Anfetamina de ação prolongada que se dissolve na boca.","Long-acting basal insulin.":"Insulina basal de ação prolongada.","Long-acting chewable methylphenidate tablet.":"Comprimido mastigável de metilfenidato de ação prolongada.","Long-acting dexmethylphenidate.":"Dexmetilfenidato de ação prolongada.","Long-acting injectable PrEP and HIV treatment for adults 18+. Provider referral only, no walk-ins; mostly private insurance.":"PrEP injetável de ação prolongada e tratamento do HIV para adultos a partir dos 18 anos. Só com referenciação médica, sem visitas sem marcação; sobretudo seguro privado.","Long-acting insulin analog":"Análogo de insulina de ação prolongada","Long-acting insulin analog (biosimilar)":"Análogo de insulina de ação prolongada (biossimilar)","Long-acting liquid clonidine for ADHD.":"Clonid ","Macau SAR":"RAE de Macau","Macau's public general hospital, with inpatient, outpatient, emergency and 29 specialties. Its HIV, ADHD and diabetes services aren't described in sources we could reach; call the Health Bureau to ask which clinic to use.":"Hospital geral público de Macau, com internamento, consultas externas, urgência e 29 especialidades. As fontes a que conseguimos aceder não descrevem os seus serviços de HIV, PHDA e diabetes; ligue para os Serviços de Saúde para saber a que consulta ir.","Magnet sexual health clinic at Strut: HIV and STI testing and treatment, PrEP (including long-acting injections) and PEP. Accepts public and private insurance, uninsured and undocumented people.":"Clínica de saúde sexual Magnet no Strut: testes e tratamento de HIV e IST, PrEP (incluindo injeções de ação prolongada) e PEP. Aceita seguro público e privado, pessoas sem seguro e sem documentos.","Mainland China":"China continental","Mainland China, Hong Kong, Macau and Taiwan are four separate jurisdictions. Each has its own laws, medicine regulator, lists of approved and controlled medicines, prescription rules and health insurance. A medicine that is approved or prescribed in one may be unavailable or restricted in another, and a prescription from one is generally not accepted in the others. Check the rules where you are.":"A China continental, Hong Kong, Macau e Taiwan são quatro jurisdições distintas. Cada uma tem as suas próprias leis, autoridade reguladora do medicamento, listas de medicamentos aprovados e controlados, regras de prescrição e seguro de saúde. Um medicamento aprovado ou receitado numa pode não estar disponível ou ser restrito noutra, e uma receita de uma geralmente não é aceite nas outras. Confirme as regras do local onde está.","Major public hospital with an infectious diseases department. Hospital PrEP and HIV clinics need a referral. In July 2025 GAT reported waits of a year or more for a first PrEP appointment at Lisbon's three hospital PrEP clinics.":"Grande hospital público com serviço de doenças infecciosas. As consultas hospitalares de PrEP e HIV exigem referenciação. Em julho de 2025 o GAT relatou esperas de um ano ou mais para a primeira consulta de PrEP nas três consultas hospitalares de Lisboa.","Major public hospital with an infectious diseases department. Hospital PrEP and HIV clinics need a referral. In July 2025 GAT reported waits of a year or more for a first PrEP appointment at Lisbon's three hospital PrEP clinics. Listed in 2018 as a referral unit for positive rapid tests.":"Grande hospital público com serviço de doenças infecciosas. As consultas hospitalares de PrEP e HIV exigem referenciação. Em julho de 2025 o GAT relatou esperas de um ano ou mais para a primeira consulta de PrEP nas três consultas hospitalares de Lisboa. Em 2018 constava como unidade de referência para testes rápidos positivos.","Maria X. Martinez Health Resource Center":"Centro de Recursos de Saúde Maria X. Martinez","MedConsult Clinic":"Clínica MedConsult","MedConsult Clinic Silom":"Clínica MedConsult Silom","MedConsult Clinic Thonglor":"Clínica MedConsult Thonglor","MedPark Hospital":"Hospital MedPark","MedPark Hospital — Endocrinology and Metabolism Center":"Hospital MedPark — Centro de Endocrinologia e Metabolismo","Medical services, pharmacy and HIV/STI care. PrEP hotline +1 323 993 8990; PEP hotline +1 323 491 2420. Free or low-cost PrEP care for insured and uninsured patients.":"Serviços médicos, farmácia e cuidados de HIV/IST. Linha PrEP +1 323 993 8990; linha PEP +1 323 491 2420. Cuidados de PrEP gratuitos ou de baixo custo para doentes com ou sem seguro.","Men's Health Foundation":"Men's Health Foundation","Men's Health Foundation — Santa Monica Blvd":"Men's Health Foundation — Santa Monica Blvd","Men's Health Foundation — South Broadway":"Men's Health Foundation — South Broadway","Methylphenidate":"Metilfenidato","Mexico":"México","Minhang District":"Distrito de Minhang","Minhang District Central Hospital":"H ria toma metformina genérica.","Multidisciplinary team (doctors, diabetes nurses, dietitians, pharmacists, foot-care specialists); rapid HbA1c and glucose testing; eye screening with referral.":"Equipa multidisciplinar (médicos, enfermeiros de diabetes, nutricionistas, farmacêuticos, especialistas em pé diabético); HbA1c e glicose rápidas; rastreio ocular com referenciação.","NNRTI":"NNRTI","NRTI":"NRTI","Named by the Ministry of Health (2008) as an anonymous HIV testing site. Check AfA's website for the current location and hours.":"O Ministério da Saúde (2008) indicou-a como local de teste anónimo do HIV. Consulte no site da AfA o local e horário atuais.","Named in November 2023 as one of Shanghai's PEP/PrEP outpatient services. Check opening times and cost before going; PEP must start within 72 hours.":"Indicado em novembro de 2023 como um dos serviços de PEP/PrEP de Xangai. Confirme horário e custo antes de ir; a PEP tem de começar nas primeiras 72 horas.","Named in November 2023 as one of Shanghai's PEP/PrEP outpatient services. Check opening times and cost before going; PEP must start within 72 hours. The city's infectious-disease hospital.":"Indicado em novembro de 2023 como um dos serviços de PEP/PrEP de Xangai. Confirme horário e custo antes de ir; a PEP tem de começar nas primeiras 72 horas. É o hospital de doenças infecciosas da cidade.","Nasal":"Nasal","Nasal powder":"Pó nasal","National Centre for Infectious Diseases (NHG Health)":"Centro Nacional de Doenças Infecciosas (NHG Health)","National Centre for Infectious Diseases — HIV care and PrEP Clinic (Clinic J)":"Centro Nacional de Doenças Infecciosas — Cuidados de HIV e Clínica de PrEP (Clínica J)","National Skin Centre (NHG Health)":"Centro Nacional de Pele (NHG Health)","National Taiwan University Hospital":"Hospital da Universidade Nacional de Taiwan","National Taiwan University Hospital — Department of Psychiatry (child ADHD)":"Hospital da Universidade Nacional de Taiwan — Departamento de Psiquiatria (PHDA infantil)","National Taiwan University Hospital — HIV services":"Hospital da Universidade Nacional de Taiwan — Serviços de HIV","National University Hospital (NUHS)":"Hospital Universitário Nacional (NUHS)","National University Hospital — Be PrEPared (BePrep) Clinic":"Hospital Universitário Nacional — Clínica Be PrEPared (BePrep)","National University Hospital — Child Development and Psychological Medicine":"Hospital Universitário Nacional — Desenvolvimento Infantil e Medicina Psicológica","National child and adolescent mental health institute. The source list doesn't name ADHD services; confirm assessment and medication.":"Instituto nacional de saúde mental da infância e adolescência. A lista de origem não indica serviços de PHDA; confirme avaliação e medicação.","Near the blood-draw room, ARI clinic":"Junto à sala de colheitas, consulta de infeções respiratórias agudas (ARI)","New Civil Hospital of Guadalajara \"Dr. Juan I. Menchaca\"":"Novo Hospital Civil de Guadalajara \"Dr. Juan I. Menchaca\"","New address from 15 July 2026.":"Nova morada a partir de 15 de julho de 2026.","New in 2026.":"Novo em 2026.","New in 2026. Islatravir is a next-generation nucleoside reverse transcriptase translocation inhibitor (NRTTI).":"Novo em 2026. O islatravir é um inibidor da translocação da transcriptase reversa análogo de nucleosídeo (NRTTI) de nova geração.","New in 2026. Starts with a 2-day initiation that adds Sunlenca tablets.":"Novo em 2026. Começa com uma introdução de 2 dias que acrescenta comprimidos de Sunlenca.","No":"Não","No phone number listed; SFAF main office is +1 415 487 3000.":"Sem telefone indicado; a sede da SFAF é o +1 415 487 3000.","No public phone number in the source list.":"A lista de origem não indica um telefone público.","Non-nucleoside reverse transcriptase inhibitor used in combination regimens.":"Inibidor da transcriptase reversa não análogo de nucleosídeo usado em esquemas combinados.","Non-nucleoside reverse transcriptase inhibitor.":"Inibidor da transcriptase reversa não análogo de nucleosídeo.","Non-nucleoside reverse transcriptase inhibitor; also used as oral lead-in for Cabenuva.":"Inibidor da transcriptase reversa não análogo de nucleosídeo; também usado como introdução oral do Cabenuva.","Non-nucleoside reverse transcriptase inhibitors (NNRTIs)":"Inibidores da transcriptase reversa não análogos de nucleosídeos (NNRTI)","Non-profit teaching hospital. HIV and diabetes services aren't described in the source; confirm.":"Hospital universitário sem fins lucrativos. A fonte não descreve os serviços de HIV e diabetes; confirme.","Non-stimulant":"Não estimulante","Non-stimulant option for children 6 and older and adults.":"Opção não estimulante para crianças a partir dos 6 anos e adultos.","Non-stimulant that can be used alone or added to a stimulant.":"Não estimulante que pode ser usado sozinho ou adicionado a um estimulante.","Norepinephrine, dopamine and serotonin reuptake inhibitor (NDSRI)":"Inibidor da recaptação de noradrenalina, dopamina e serotonina (NDSRI)","North Bangkok":"Banguecoque norte","North Thonburi":"Thonburi norte","Northeast Valley Health Corporation":"Northeast Valley Health Corporation","Northeast Valley Health Corporation — Van Nuys":"Northeast Valley Health Corporation — Van Nuys","Not controlled":"Não controlada","Not recommended for people with heart failure.":"Não recomendado para pessoas com insuficiência cardíaca.","Nucleoside reverse transcriptase inhibitor used as part of a combination regimen.":"Inibidor da transcriptase reversa análogo de nucleosídeo usado como parte de um esquema combinado.","Nucleoside reverse transcriptase inhibitor widely used in combination regimens.":"Inibidor da transcriptase reversa análogo de nucleosídeo muito usado em esquemas combinados.","Nucleoside reverse transcriptase inhibitor; also a component of many combination pills.":"Inibidor da transcriptase reversa análogo de nucleosídeo; também faz parte de muitos comprimidos combinados."," de PrEP no The Lobby (clínica HAP). Doentes com seguro público, sem seguro ou sem documentos.","Only one public child psychiatry service is listed so far. Ask a local doctor which ADHD medicines are approved in Mainland China.":"Por agora só há um serviço público de pedopsiquiatria. Pergunte a um médico local que medicamentos para a PHDA estão aprovados na China continental.","Open daily; doctor consultations by appointment only. Phone lines 08:00–20:00.":"Aberto todos os dias; consultas médicas só com marcação. Telefone das 08:00 às 20:00.","Opened December 2022 as the first specialised HIV/STI centre for the Guadalajara metropolitan area: testing, PrEP and PEP, antiretroviral pharmacy, counselling, psychology, dental care. Public service; confirm cost.":"Abriu em dezembro de 2022 como o primeiro centro especializado em HIV/IST da área metropolitana de Guadalajara: testes, PrEP e PEP, farmácia de antirretrovirais, aconselhamento, psicologia e medicina dentária. Serviço público; confirme o custo.","Opened December 2023. AIDS Counselling and Testing Service, a Therapeutic Prevention Clinic giving preventive treatment after possible exposure to HIV or hepatitis, and The Commons: one-stop HIV, hepatitis and STI screening for higher-risk groups.":"Abriu em dezembro de 2023. Serviço de Aconselhamento e Teste da Sida, uma Clínica de Prevenção Terapêutica que dá tratamento preventivo após possível exposição ao HIV ou à hepatite, e The Commons: rastreio integrado de HIV, hepatite e IST para grupos de maior risco.","Oral":"Oral","Oral + Injection":"Oral + injeção","Oral / IV":"Oral / IV","Oral cabotegravir used as an optional lead-in before Cabenuva or Apretude injections.":"Cabotegravir oral usado como introdução opcional antes das injeções de Cabenuva ou Apretude.","Oral: DPP-4 inhibitor":"Oral: inibidor da DPP-4","Oral: SGLT2 inhibitor":"Oral: inibidor do SGLT2","Oral: biguanide":"Oral: biguanida","Oral: sulfonylurea":"Oral: sulfonilureia","Oral: thiazolidinedione":"Oral: tiazolidinediona","Organisation for female sex workers, listed by AIDS Concern as an HIV testing location.":"Organização para trabalhadoras do sexo que a AIDS Concern indica como local de teste do HIV.","Other":"Outros","Outpatient and inpatient diabetes care with a multidisciplinary diabetes care team and diabetes health education.":"Cuidados de diabetes em ambulatório e internamento com equipa multidisciplinar e educação sobre diabetes.","Outpatient assessment, diagnosis and treatment of ADHD for under-18s, a 25-bed inpatient ward, and ADHD parent education classes (a national ADHD health education base).":"Avaliação, diagnóstico e tratamento em ambulatório da PHDA para menores de 18, um internamento com 25 camas e aulas para pais sobre PHDA (centro nacional de educação para a saúde sobre PHDA).","Outpatient clinic, 1st Floor, HRH Princess Mahachakri Building (confirm floor)":"Consulta externa, 1.º piso, edifício HRH Princess Mahachakri (confirme o piso)","PEP has to start within 72 hours. Go to a clinic that lists PEP or a hospital emergency department. The city's BKK Pride Clinic network lists PrEP and PEP as free.":"A PEP tem de começar nas primeiras 72 horas. Vá a uma clínica que ofereça PEP ou às urgências de um hospital. A rede BKK Pride Clinic da cidade indica PrEP e PEP gratuitas.","PI":"IP","Pacoima Health Center — Sexual Health Clinic":"Pacoima Health Center — Clínica de Saúde Sexual","Paediatric clinic; scope includes attention and behavioural disorders including ADHD. Medication not mentioned.":"Consulta pediátrica; abrange perturbações de atenção e comportamento, incluindo a PHDA. Não menciona medicação.","Part of Taiwan CDC's one-stop anonymous rapid HIV screening (2019) and one of three Taipei hospitals named for the city PrEP subsidy (2021). Non-occupational PEP in Taiwan is self-paid (about NT$30,000) at a hospital infectious-disease clinic that offers it; start within 72 hours.":"Participa no rastreio rápido e anónimo do HIV dos CDC de Taiwan (2019) e é um dos três hospitais de Taipé indicados para o subsídio municipal de PrEP (2021). Em Taiwan a PEP não ocupacional é paga pelo próprio (cerca de NT$30 000) na consulta de doenças infecciosas de um hospital que a ofereça; tem de começar em 72 horas.","Pediatric dispersible formulation of dolutegravir.":"Formulação pediátrica dispersível de dolutegravir.","Pediatric dispersible formulation of rilpivirine.":"Formulação pediátrica dispersível de rilpivirina.","Pediatric dispersible version of Triumeq.":"Versão pediátrica dispersível do Triumeq.","Pediatric formulation":"Formulação pediátrica","Pediatric-dose version of Prezcobix.":"Versão em dose pediátrica do Prezcobix.","Peer-led screening for HIV, syphilis and hepatitis B and C, and PrEP counselling by appointment, aimed at migrants and sex workers.":"Rastreio de HIV, sífilis e hepatites B e C feito por pares, e aconselhamento sobre PrEP com marcação, dirigido a migrantes e trabalhadores do sexo.","Per HHS guidelines, used as a PK enhancer rather than as an active antiretroviral.":"Segundo as diretrizes do HHS, usa-se como potenciador farmacocinético e não como antirretroviral ativo.","Pharmacokinetic Enhancer":"Potenciador farmacocinético","Pharmacokinetic enhancers":"Potenciadores farmacocinéticos","Phone also works on WhatsApp.":"O telefone também funciona por WhatsApp.","Portugal":"Portugal","Post-Attachment Inhibitor":"Inibidor pós-ligação","Post-attachment inhibitors":"Inibidores pós-ligação","PrEP":"PrEP","PrEP and HIV treatment for people experiencing or at risk of homelessness. Uninsured, undocumented and public insurance.":"PrEP e tratamento do HIV para pessoas em situação de sem-abrigo ou em risco. Sem seguro, sem documentos e com seguro público.","PrEP and HIV treatment including long-acting injections. For patients assigned to this clinic by their public insurance plan; also serves undocumented people.":"PrEP e tratamento do HIV, incluindo injeções de ação prolongada. Para doentes atribuídos a esta clínica pelo seguro público; também atende pessoas sem documentos.","PrEP indication excludes people at risk through receptive vaginal sex.":"A indicação de PrEP exclui pessoas em risco por sexo vaginal recetivo.","PrEP is prescribed at public clinics (DSC, NCID, NUH) and private GPs. Around 2022, guides quoted S$100–200 per visit plus the medicine. PEP must start within 72 hours.":"A PrEP é receitada em clínicas públicas (DSC, NCID, NUH) e por médicos de família privados. Por volta de 2022, os guias indicavam S$100–200 por consulta mais o medicamento. A PEP tem de começar nas primeiras 72 horas.","Pribta Clinic":"Clínica Pribta","Primary care, HIV testing, STI testing and treatment, transgender services. Ask whether PrEP/PEP are prescribed on site.":"Cuidados primários, teste do HIV, testes e tratamento de IST, serviços trans. Pergunte se receitam PrEP/PEP no local.","Princess Margaret Hospital — Infectious Disease Special Medical Clinic":"Hospital Princess Margaret — Clínica Médica Especial de Doenças Infecciosas","Private hospital with multilingual staff. For PEP, go straight to the 24-hour emergency department; PEP must start within 72 hours (ideally within 2).":"Hospital privado com pessoal multilingue. Para a PEP, vá diretamente à urgência (aberta 24 h); a PEP tem de começar em 72 horas (idealmente em 2).","Prodrug of the protease inhibitor amprenavir.":"Pró-fármaco do inibidor da protease amprenavir.","Prodrug the body converts into dextroamphetamine, giving a smooth, long effect.":"Pró-fármaco que o corpo converte em dextroanfetamina, com um efeito suave e prolongado.","Protease inhibitor for treatment-experienced patients with PI resistance.":"Inibidor da protease para doentes com tratamento prévio e resistência a IP.","Protease inhibitor now used almost only as a pharmacokinetic booster for other PIs.":"Inibidor da protease hoje usado quase só como potenciador farmacocinético de outros IP.","Protease inhibitor with a high barrier to resistance; must be boosted.":"Inibidor da protease com elevada barreira à resistência; tem de ser potenciado.","Protease inhibitor, usually given with a booster (ritonavir or cobicistat).":"Inibidor da protease geralmente dado com um potenciador (ritonavir ou cobicistat).","Protease inhibitors (PIs)":"Inibidores da protease (IP)","Psychiatry clinic, 2nd Floor, 72 Phansa Maharachini Building":"Consulta de psiquiatria, 2.º piso, edifício 72 Phansa Maharachini","Public ADHD care is through SNS child psychiatry and psychiatry services, by referral from your family doctor.":"Os cuidados públicos da PHDA são feitos na pedopsiquiatria e psiquiatria do SNS, com referenciação do médico de família.","Public anonymous counselling and testing centre (CAD) in a health centre.":"Centro público de aconselhamento e teste anónimo (CAD) num centro de saúde.","Public child ADHD care is mainly by referral from a polyclinic, CHAS GP or the school-linked REACH teams. Consultations and therapy can be subsidised by up to 70%.":"Os cuidados públicos da PHDA infantil são sobretudo por referenciação de uma policlínica, de um médico de família CHAS ou das equipas REACH ligadas às escolas. As consultas e terapias podem ter subsídios até 70%.","Public child and adolescent psychiatry is through the Hospital Authority, usually by referral. Ask a local doctor which ADHD medicines are registered in Hong Kong.":"A psiquiatria da infância e adolescência pública é feita pela Autoridade Hospitalar, normalmente com referenciação. Pergunte a um médico local que medicamentos para a PHDA estão registados em Hong Kong.","Public child psychiatry is at the Hospital Civil; ask which ADHD medicines are available in Mexico.":"A pedopsiquiatria pública fica no Hospital Civil; pergunte que medicamentos para a PHDA existem no México.","Public diabetes care is through Hospital Authority clinics; specialist assessment centres may charge fees.":"Os cuidados públicos da diabetes são prestados nas clínicas da Autoridade Hospitalar; os centros especializados de avaliação podem cobrar.","Public diabetes centres are at the major hospitals; polyclinics manage most routine diabetes care.":"Os centros públicos de diabetes ficam nos grandes hospitais; as policlínicas acompanham a maior parte dos cuidados habituais da diabetes.","Public health centres and the public hospital provide chronic disease care; confirm diabetes services directly.":"Os centros de saúde públicos e o hospital público tratam doenças crónicas; confirme diretamente os serviços de diabetes.","Public hospital HIV clinic. Hospital emergency departments can assess people for PEP within 72 hours of a high-risk exposure (decided case by case).":"Clínica de HIV de hospital público. As urgências hospitalares podem avaliar a PEP nas 72 horas após uma exposição de alto risco (caso a caso).","Public service for under-18s, mainly residents of Kowloon West and part of Kowloon Central. ADHD is among the conditions treated. New cases are triaged by senior psychiatric nurses at the Integrated Clinic.":"Serviço público para menores de 18 anos, sobretudo residentes de Kowloon Oeste e parte de Kowloon Centro. A PHDA está entre as condições tratadas. Os casos novos são triados por enfermeiros psiquiátricos seniores na Clínica Integrada.","Public sexual health clinic: HIV, hepatitis and STI testing (free with an SNS number), PrEP, STI treatment and contraception. Walk-in and by appointment. In July 2025 GAT reported waits of a year or more for a first PrEP appointment at Lisbon's three hospital PrEP clinics.":"Clínica pública de saúde sexual: testes de HIV, hepatites e IST (gratuitos com número de utente do SNS), PrEP, tratamento de IST e contraceção. Sem marcação e por marcação. Em julho de 2025 o GAT relatou esperas de um ano ou mais para a primeira consulta de PrEP nas três consultas hospitalares de Lisboa.","Queen Elizabeth Hospital — AIDS Clinical Service":"Hospital Queen Elizabeth — Serviço Clínico da Sida","RSAT Clinic Ramkhamhaeng":"Clínica RSAT Ramkhamhaeng","Rainbow Sky Association of Thailand (RSAT)":"Associação Rainbow Sky da Tailândia (RSAT)","Rajanagarindra Institute of Child and Adolescent Mental Health":"Instituto Rajanagarindra de Saúde Mental da Infância e Adolescência","Rapid HIV testing for gay, bi and other men who have sex with men.":"Teste rápido do HIV para homens gays, bissexuais e outros homens que têm sexo com homens.","Rapid-acting insulin analog":"Análogo de insulina de ação rápida","Rapid-acting mealtime insulin.":"Insulina de ação rápida para as refeições.","Ratchaphiphat Hospital":"Hospital Ratchaphiphat","Ratchaphiphat Hospital — BKK Pride Clinic":"Hospital Ratchaphiphat","Receives ADHD referrals from REACH for school-age children. Public child ADHD care in Singapore is mainly by referral (polyclinic, CHAS GP or the school-linked REACH teams); consultations and therapy get subsidies of up to 70%.":"Recebe referenciações de PHDA da REACH para crianças em idade escolar. Em Singapura os cuidados públicos da PHDA infantil são sobretudo por referenciação (policlínica, médico CHAS ou equipas REACH das escolas); consultas e terapias com subsídios até 70%.","Referral needed.":"Requer referenciação.","Registration: Mon 11:00–15:00, 16:00–19:30; Tue–Thu 07:30–11:00, 12:00–16:00; Fri 07:30–11:00.":"Inscrição: seg 11:00–15:00, 16:00–19:30; ter–qui 07:30–11:00, 12:00–16:00; sex 07:30–11:00.","Registration: Mon–Wed 07:30–11:00, 12:00–16:00; Thu 11:00–15:00, 16:00–19:30; Fri 07:30–11:00. Screening only Mon, Wed, Fri mornings; full services Tue & Thu.":"Inscrição: seg–qua 07:30–11:00, 12:00–16:00; qui 11:00–15:00, 16:00–19:30; sex 07:30–11:00. Só rastreio às manhãs de segunda, quarta e sexta; todos os serviços à terça e quinta.","Registration: Tue & Thu 07:00–11:30, 12:30–17:30; Wed 09:00–13:30, 14:30–19:30; Fri 07:00–11:30. No clinic Mon.":"Inscrição: ter e qui 07:00–11:30, 12:30–17:30; qua 09:00–13:30, 14:30–19:30; sex 07:00–11:30. Sem consulta à segunda.","Registration: Tue & Wed 07:00–11:30, 12:30–17:30; Thu 09:00–13:30, 14:30–19:30; Fri 07:00–11:30. No clinic Mon.":"Inscrição: ter e qua 07:00–11:30, 12:30–17:30; qui 09:00–13:30, 14:30–19:30; sex 07:00–11:30. Sem consulta à segunda.","Registration: Tue 09:00–13:30, 14:30–19:30; Wed & Thu 07:30–11:30, 12:30–17:30; Fri 07:00–11:30. No clinic Mon.":"Inscrição: ter 09:00–13:30, 14:30–19:30; qua e qui 07:30–11:30, 12:30–17:30; sex 07:00–11:30. Sem consulta à segunda.","Reports from 2023 say Hong Kong has no public PrEP programme, so PrEP is mostly through private doctors and NGOs. For PEP within 72 hours, go to a public hospital emergency department (A&E), where doctors decide case by case, or to a private clinic (about HK$10,000–20,000 for the medicine). Department of Health clinics offer free or low-cost testing.":"Segundo notícias de 2023, Hong Kong não tem um programa público de PrEP, pelo que a PrEP é obtida sobretudo através de médicos privados e ONG. Para a PEP nas primeiras 72 horas, vá às urgências (A&E) de um hospital público, onde os médicos decidem caso a caso, ou a uma clínica privada (cerca de HK$10 000–20 000 pelo medicamento). As clínicas do Departamento de Saúde fazem testes gratuitos ou de baixo custo.","Requires a tropism test to confirm CCR5-tropic virus.":"Requer um teste de tropismo que confirme vírus com tropismo CCR5.","Ruijin Hospital (SJTU)":"Hospital Ruijin (SJTU)","Ruijin Hospital — Shanghai Institute of Endocrine and Metabolic Diseases":"Hospital Ruijin — Instituto de Doenças Endócrinas e Metabólicas de Xangai","SATA CommHealth":"SATA CommHealth","SGLT2 inhibitor":"Inibidor do SGLT2","SGLT2 inhibitor + DPP-4 inhibitor":"Inibidor do SGLT2 + inibidor da DPP-4","SGLT2 inhibitor + biguanide":"Inibidor do SGLT2 + biguanida","SGLT2 inhibitor also approved for heart failure and chronic kidney disease.":"Inibidor do SGLT2 também aprovado para insuficiência cardíaca e doença renal crónica.","SGLT2 inhibitor shown to lower the risk of cardiovascular death in type 2 diabetes.":"Inibidor do SGLT2 que demonstrou reduzir o risco de morte cardiovascular na diabetes tipo 2.","SGLT2 inhibitor taken once daily.":"Inibidor do SGLT2 de uma toma diária.","SWING Clinic Bangkok":"Clínica SWING Banguecoque","Same-day ART for people who test positive. PEP appears only in page keywords; confirm with clinic.":"Início do TAR no mesmo dia para quem tem resultado positivo. A PEP só aparece nas palavras-chave da página; confirme com a clínica.","Same-day ART is listed under the centre's Ratchadamri Clinic; a transgender clinic is also listed. Hours are centre-wide; the site gives no separate Anonymous Clinic hours.":"O início de TAR no mesmo dia consta na Clínica Ratchadamri do centro; existe também uma clínica trans. O horário é do centro em geral; o site não indica um horário próprio da Clínica Anónima.","Samitivej Children's Hospital — Growth, Endocrine and Diabetes Center":"Hospital Pediátrico Samitivej — Centro de Crescimento, Endocrinologia e Diabetes","Samitivej International Children's Hospital":"Hospital Pediátrico Internacional Samitivej","San Francisco":"São Francisco","San Francisco AIDS Foundation":"Fundação da Sida de São Francisco","San Francisco AIDS Foundation — 6th Street Center":"San Francisco AIDS Foundation — Centro da Rua 6","San Francisco AIDS Foundation — Strut (Magnet)":"San Francisco AIDS Foundation — Strut (Magnet)","San Francisco City Clinic":"San Francisco City Clinic","San Francisco City Clinic offers free HIV testing, PrEP, PEP and treatment, including for uninsured and undocumented people. PEP must start within 72 hours.":"A San Francisco City Clinic oferece teste do HIV, PrEP, PEP e tratamento gratuitos, incluindo a pessoas sem seguro ou sem documentos. A PEP tem de começar nas primeiras 72 horas.","San Francisco Community Health Center":"San Francisco Community Health Center","San Francisco Department of Public Health":"Departamento de Saúde Pública de São Francisco","Schedule II":"Lista II (EUA)","Screening only: people with symptoms are referred to a full-service clinic. Free (no copay; insurance billed if you have it). HIV testing, PrEP (pills or monthly injection), PEP within 72 hours, STI testing and treatment, doxy-PEP. Walk-ins welcome; book on +1 213 449 7009. Hours are registration hours.":"Apenas rastreio: quem tem sintomas é encaminhado para uma clínica com todos os serviços. Gratuito (sem copagamento; o seguro é cobrado se o tiver). Teste do HIV, PrEP (comprimidos ou injeção mensal), PEP em 72 horas, testes e tratamento de IST, doxi-PEP. Aceita visitas sem marcação; marque pelo +1 213 449 7009. O horário é de inscrição.","Second-generation NNRTI, mainly for treatment-experienced patients.":"NNRTI de segunda geração, sobretudo para doentes com tratamento prévio.","Secretaría de Salud Jalisco":"Secretaria de Saúde de Jalisco","See label":"Ver a bula","Selective norepinephrine reuptake inhibitor":"Inibidor seletivo da recaptação de noradrenalina","Serves children and adults. Insulin pump with glucose sensor has its own treatment page. Foot and Nail Care Clinic is on Building A, 16th Floor (02 011 3322).":"Atende crianças e adultos. A bomba de insulina com sensor de glicose tem página própria. A clínica de pés e unhas fica no edifício A, 16.º piso (02 011 3322).","Service Workers in Group Foundation (SWING)":"Fundação SWING (Service Workers in Group)","Services (HIV/TB/STI testing and treatment, free PrEP and PEP, hormone care) are listed for the BKK Pride Clinic network as a whole, not per site. Confirm what this site offers.":"Os serviços (teste e tratamento de HIV/TB/IST, PrEP e PEP gratuitas, cuidados hormonais) são indicados para toda a rede BKK Pride Clinic, não para cada local. Confirme o que este local oferece.","Sexual health appointments Tue & Thu 12:30, 14:00, 17:00, 18:00; Sat 09:00, 11:00, 14:00, 15:30 (per UCSF trans guide; confirm).":"Consultas de saúde sexual ter e qui 12:30, 14:00, 17:00, 18:00; sáb 09:00, 11:00, 14:00, 15:30 (segundo o guia trans da UCSF; confirme).","Sexual health services by online appointment.":"Serviços de saúde sexual com marcação online.","Shanghai":"Xangai","Shanghai Mental Health Center (SJTU School of Medicine)":"Centro de Saúde Mental de Xangai (Faculdade de Medicina da SJTU)","Shanghai Mental Health Center — Child and Adolescent Psychiatry":"Centro de Saúde Mental de Xangai — Psiquiatria da Infância e Adolescência","Shanghai Municipal Health Commission":"Comissão Municipal de Saúde de Xangai","Shanghai Public Health Clinical Center":"Centro Clínico de Saúde Pública de Xangai","Shanghai Qingai":"Shanghai Qingai","Shanghai Qingai Dermatology Clinic":"Clínica Dermatológica Qingai de Xangai","Shanghai Qingai Health Promotion Center":"Centro de Promoção da Saúde Qingai de Xangai","Shanghai Sixth People's Hospital (SJTU)":"Sexto Hospital Popular de Xangai (SJTU)","Shanghai Sixth People's Hospital — Endocrinology & Metabolism (Shanghai Diabetes Institute)":"Sexto Hospital Popular de Xangai — Endocrinologia e Metabolismo (Instituto de Diabetes de Xangai)","Shanghai United Family Hospital (Changning)":"Shanghai United Family Hospital (Changning)","Shanghai has more than 200 free HIV voluntary counselling and testing (VCT) sites. Find them through the city's official VCT finder or the 上海疾控 WeChat account. PEP must start within 72 hours.":"Xangai tem mais de 200 locais gratuitos de aconselhamento e teste voluntário do HIV (VCT). Encontre-os no localizador oficial da cidade ou na conta de WeChat 上海疾控. A PEP tem de começar nas primeiras 72 horas.","Short-acting dexmethylphenidate, the more active half of the methylphenidate molecule.":"Dexmetilfenidato de ação curta, a metade mais ativa da molécula de metilfenidato.","Short-acting human insulin":"Insulina humana de ação curta","Short-acting methylphenidate; one of the oldest ADHD medicines still in use.":"Metilfenidato de ação curta; um dos medicamentos para PHDA mais antigos ainda em uso.","Short-acting mix of four amphetamine salts.":"Mistura de ação curta de quatro sais
