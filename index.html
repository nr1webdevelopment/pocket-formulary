<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Formulary</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%23A3191F%22%2F%3E%3Cg%20transform%3D%22translate%2817%2011%29%20rotate%28-35%29%22%3E%3Crect%20x%3D%22-8.5%22%20y%3D%22-3.6%22%20width%3D%2217%22%20height%3D%227.2%22%20rx%3D%223.6%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M0%20-3.6H-4.9A3.6%203.6%200%200%200%20-4.9%203.6H0Z%22%20fill%3D%22%23F7C6C8%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M6.5%2014h19v6.5c0%203.6-2.9%206.5-6.5%206.5h-6c-3.6%200-6.5-2.9-6.5-6.5Z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M9.5%2017h13%22%20stroke%3D%22%23A3191F%22%20stroke-width%3D%221.2%22%20stroke-dasharray%3D%221.8%201.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">

<style>
/* Layout: a pharmacy-label reference. One narrow column; condition colors come from each disease's awareness symbol
   (HIV red ribbon, ADHD orange ribbon, diabetes blue circle). List view <-> profile view via #slug. */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --ink: #15202B; --muted: #5A6774; --line: #DAE0E6; --soft: #E9EDF1;
  --hiv: #C8102E; --adhd: #C2600A; --diabetes: #1C64C8; --warn: #8A5A00; --warn-bg: #FFF2D6;
  --prov: #0E7C6B; --ok: #1F7A35; --ok-bg: #E2F3E6; --alert: #A3122A; --alert-bg: #FDE8EB;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141A; --surface: #151D25; --ink: #E5EBF0; --muted: #94A2AF; --line: #27323D; --soft: #1C2630;
  --hiv: #FF6070; --adhd: #F39B47; --diabetes: #6AA6FF; --warn: #F2C46B; --warn-bg: #3A2C10;
  --prov: #3CC8AE; --ok: #7BD88F; --ok-bg: #173322; --alert: #FF8A99; --alert-bg: #3A1520; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #151D25; --ink: #E5EBF0; --muted: #94A2AF; --line: #27323D; --soft: #1C2630;
  --hiv: #FF6070; --adhd: #F39B47; --diabetes: #6AA6FF; --warn: #F2C46B; --warn-bg: #3A2C10;
  --prov: #3CC8AE; --ok: #7BD88F; --ok-bg: #173322; --alert: #FF8A99; --alert-bg: #3A1520; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--diabetes); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sym { width: 18px; height: 18px; flex: none; }

/* masthead */
.mast { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.mast .rx { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--prov); font-weight: 500; }
.mast h1 { font-size: clamp(32px, 6.4vw, 52px); line-height: 1.02; letter-spacing: -.02em; }
.mast p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 16px; }

/* hero: AI image (assets/hero.*) behind a white gradient, so text stays readable on the left */
.hero { position: relative; isolation: isolate; overflow: hidden; justify-content: flex-end; min-height: 320px;
  padding: 40px 40px 36px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); }
.hero-img { position: absolute; inset: 0; z-index: -2; background: radial-gradient(60% 90% at 85% 30%, #F4C7C9 0%, transparent 70%), radial-gradient(45% 70% at 65% 95%, #E3E6EA 0%, transparent 70%), radial-gradient(35% 60% at 98% 85%, #FFDCC8 0%, transparent 70%), #F7F1F1; background-size: cover; background-position: 70% 50%; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, var(--surface) 0%, var(--surface) 30%, color-mix(in srgb, var(--surface) 82%, transparent) 50%, color-mix(in srgb, var(--surface) 25%, transparent) 78%, transparent 100%); }
.hero > :not(.hero-img) { max-width: 520px; }
@media (max-width: 640px) {
  .hero { min-height: 0; padding: 150px 20px 24px; border-radius: 16px; }
  .hero-img { background-position: 70% 0%; background-size: auto 230px; background-repeat: no-repeat; }
  .hero::before { background: linear-gradient(180deg, transparent 0, color-mix(in srgb, var(--surface) 30%, transparent) 80px, color-mix(in srgb, var(--surface) 92%, transparent) 150px, var(--surface) 180px); }
}

/* brand */
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.topbar-end { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
@media (max-width: 640px) {
  .topbar-end { display: contents; }
  .topbar .brand { order: 1; }
  .topbar .langsel { order: 2; }
  .topbar .nav { order: 3; flex: 1 1 100%; }
  .topbar .nav a { flex: 1; text-align: center; }
}

/* condition tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tab { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; font: inherit; min-width: 0; }
.tab .t { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tab:hover { border-color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--c, var(--ink)); box-shadow: inset 0 0 0 1px var(--c, var(--ink)); }
@media (max-width: 560px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 8px; }
.search { flex: 1 1 260px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; }
.search::placeholder { color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
.blurb { color: var(--muted); font-size: 14px; margin: 4px 0 0; min-height: 1.5em; }

/* list */
.cond-block { margin-top: 30px; }
.cond-h { display: flex; align-items: center; gap: 10px; color: var(--c); padding-bottom: 8px; border-bottom: 2px solid var(--c); }
.cond-h h2 { font-size: 24px; color: var(--ink); }
.cond-h .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.grp-h { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  margin: 18px 0 4px; display: flex; gap: 8px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 170px; gap: 4px 16px; align-items: baseline;
  padding: 10px 8px; border-bottom: 1px solid var(--line); text-decoration: none; border-radius: 6px; }
.row:hover { background: var(--soft); }
.row .nm { min-width: 0; }
.row .nm b { font-weight: 600; }
.row .gen { color: var(--muted); margin-left: 8px; font-size: 14px; }
.row .cls { color: var(--muted); font-size: 13.5px; min-width: 0; }
.row .yr { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; }
@media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .cls { grid-column: 1 / -1; grid-row: 2; } .row .gen { display: block; margin: 0; } }
.pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px;
  border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill.disc { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.pill.new { color: var(--c); }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* profile */
.back { display: inline-flex; align-items: center; gap: 6px; font: 500 14px var(--body); color: var(--muted);
  background: none; border: 0; padding: 6px 0; cursor: pointer; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.label { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.label-top { border-top: 6px solid var(--c); padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--c); font-family: var(--mono); font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase; }
.label h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1; letter-spacing: -.015em; }
.generic { font-size: 18px; color: var(--muted); }
.chips:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--soft); color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); margin: 0; }
.fact { padding: 14px 24px; border-bottom: 1px solid var(--line); min-width: 0; }
.fact:nth-child(odd) { border-right: 1px solid var(--line); }
.fact dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.fact dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } .fact:nth-child(odd) { border-right: 0; } .label-top, .fact { padding-left: 18px; padding-right: 18px; } }
.about { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.about h3 { font-size: 15px; font-family: var(--mono); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.about p { margin: 4px 0 0; max-width: 65ch; }
.note { background: var(--warn-bg); color: var(--ink); padding: 12px 14px; border-radius: 8px; }
.related { margin-top: 28px; }
.related h3 { font-size: 18px; margin-bottom: 10px; }
.rel { display: flex; flex-wrap: wrap; gap: 8px; }
.rel a { text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.rel a:hover { border-color: var(--c); }
.rel a span { color: var(--muted); }
.src { margin-top: 28px; font-size: 13px; color: var(--muted); }
.src a { color: var(--ink); }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .label { animation: rise .25s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

/* section nav (Medicines / Providers) */
.nav { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; margin: 4px 0 18px; max-width: 100%; }
.nav a { text-decoration: none; padding: 7px 14px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.nav a span { font-family: var(--mono); font-weight: 400; font-size: 12px; margin-left: 6px; }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* providers */
.alert { background: var(--alert-bg); border-left: 4px solid var(--alert); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.alert strong { color: var(--alert); }
.alert p { margin: 4px 0 10px; max-width: 70ch; }
.btn { font: 600 14px var(--body); padding: 7px 12px; border-radius: 8px; border: 1px solid currentColor; background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--c, var(--ink)); }
.notice { background: var(--warn-bg); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
.svc-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { font: 500 13.5px var(--body); padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.fchip:hover { border-color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--prov); border-color: var(--prov); color: #fff; }
:root[data-theme="dark"] .fchip[aria-pressed="true"] { color: #0E141A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fchip[aria-pressed="true"] { color: #0E141A; } }
.select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; max-width: 100%; }
.legend { font-size: 13px; color: var(--muted); margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.prow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 320px; gap: 4px 16px; align-items: center;
  padding: 11px 8px; border-bottom: 1px solid var(--line); text-decoration: none; border-radius: 6px; }
.prow:hover { background: var(--soft); }
.prow .nm { min-width: 0; }
.prow .nm b { font-weight: 600; display: block; }
.prow .th { color: var(--muted); font-size: 13px; }
.prow .where { color: var(--muted); font-size: 13.5px; min-width: 0; }
.prow .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
@media (max-width: 640px) { .prow { grid-template-columns: minmax(0, 1fr); } .prow .badges { justify-content: flex-start; } }
.sb { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--prov); color: var(--prov); white-space: nowrap; }
.sb.solid { background: var(--prov); color: var(--surface); }
.sb.net { border-style: dashed; }
.vstat { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.vstat.unverified, .vstat.needs_review { color: var(--warn); background: var(--warn-bg); }
.vstat.verified { color: var(--ok); background: var(--ok-bg); }
.vstat.closed { color: var(--muted); background: var(--soft); text-decoration: line-through; }
.svc-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.svc-list li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 24px; border-bottom: 1px solid var(--line); min-width: 0; }
.svc-list li:nth-child(odd) { border-right: 1px solid var(--line); }
.svc-list .ic { font-family: var(--mono); font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; }
.ic.yes { background: var(--prov); color: var(--surface); }
.ic.net { border: 1.5px dashed var(--prov); color: var(--prov); }
.ic.no { background: var(--soft); color: var(--muted); }
.ic.unk { border: 1.5px solid var(--line); color: var(--muted); }
.svc-list b { display: block; font-weight: 600; }
.svc-list small { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .svc-list { grid-template-columns: minmax(0, 1fr); } .svc-list li:nth-child(odd) { border-right: 0; } .svc-list li { padding-left: 18px; padding-right: 18px; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 20px; }
@media (max-width: 560px) { .actions { padding-left: 18px; padding-right: 18px; } }
.vbox { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 20px; background: var(--surface); font-size: 14px; }
.vbox dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; }
.vbox dt { color: var(--muted); }
.vbox dd { margin: 0; }
.src ul { margin: 6px 0 0; padding-left: 18px; }
.src li { margin: 2px 0; }

/* i18n + cities */
:root { --body: "Public Sans", "Helvetica Neue", Arial, "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Noto Sans Thai", "Thonburi", system-ui, sans-serif; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar .nav { margin: 0; }
.langsel { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.langsel svg { width: 18px; height: 18px; }
.langsel select { font: 500 14px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.citybar { margin: 0 0 16px; padding: 0; border: 0; }
.citylabel { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.cityregion { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
.cityregion .rlabel { flex: 0 0 auto; min-width: 84px; font-size: 13px; color: var(--muted); }
.citychip { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.2; }
.citychip:hover { border-color: var(--ink); }
.citychip .n { font: 500 12px var(--mono); color: var(--muted); }
.citychip[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.citychip[aria-current="page"] .n { color: var(--surface); opacity: .75; }
.citychip:focus-visible { outline: 2px solid var(--prov); outline-offset: 2px; }
@media (max-width: 600px) { .cityregion .rlabel { flex-basis: 100%; min-width: 0; font-size: 12px; } }
.jnote { border: 1px solid var(--diabetes); border-left-width: 4px; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; background: var(--surface); }
.jnote strong { color: var(--diabetes); }
.jnote p { margin: 4px 0 0; max-width: 75ch; }
.notice p { max-width: 75ch; }
.rel a.ghost { border-style: dashed; color: var(--muted); }
:lang(zh-Hans) .mast .rx, :lang(zh-Hant) .mast .rx, :lang(th) .mast .rx, :lang(zh-Hans) .fact dt, :lang(zh-Hant) .fact dt, :lang(th) .fact dt { letter-spacing: .04em; }

/* ===== Editorial theme: black site bar, square white cards on grey, serif headings, solid icon squares ===== */
:root { --accent: #A3191F; --band: #3F2D4A; --link: #00788A;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --mono: var(--body); }
:root[data-theme="dark"] { --link: #5CC8D8; --accent: #FF8086; --band: #2A2033; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --link: #5CC8D8; --accent: #FF8086; --band: #2A2033; } }
:lang(zh-Hans), :lang(zh-Hant), :lang(th) { --display: var(--body); }
body { font-size: 16px; }
h1, h2, h3 { font-weight: 600; letter-spacing: 0; }
.wrap { max-width: 1040px; padding-top: 22px; }

/* site bar */
#sitebar { background: #000; color: #fff; }
#sitebar .topbar { max-width: 1040px; margin: 0 auto; min-height: 64px; align-items: stretch; flex-wrap: nowrap; gap: 0 16px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#sitebar .brand { background: #fff; color: #15202B; padding: 10px 22px; font-size: 21px; gap: 12px; }
#sitebar .brand svg { width: 34px; height: 34px; border-radius: 0; }
#sitebar .topbar-end { flex-wrap: nowrap; gap: 0 22px; }
#sitebar .nav { background: none; padding: 0; gap: 0; border-radius: 0; }
#sitebar .nav a { color: #fff; font-weight: 400; font-size: 17px; padding: 4px 18px; border-radius: 0; box-shadow: none; background: none; }
#sitebar .nav a + a { border-left: 1px solid rgb(255 255 255 / .55); }
#sitebar .nav a span { color: rgb(255 255 255 / .6); font-size: 13px; display: inline-block; }
#sitebar .nav a:hover, #sitebar .nav a[aria-current="page"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
#sitebar .langsel { color: rgb(255 255 255 / .75); }
#sitebar .langsel select { background: #000; color: #fff; border: 1px solid rgb(255 255 255 / .4); border-radius: 0; }
#sitebar :focus-visible { outline-color: #fff; }
@media (max-width: 640px) {
  #sitebar .topbar { flex-wrap: wrap; padding-bottom: 8px; }
  #sitebar .brand { font-size: 16px; padding: 10px 12px; gap: 8px; }
  #sitebar .brand svg { width: 28px; height: 28px; }
  #sitebar .langsel { margin-left: auto; align-self: center; }
  #sitebar .langsel svg { display: none; }
  #sitebar .langsel select { font-size: 13px; padding: 5px 4px; }
  #sitebar .nav a { font-size: 16px; padding: 6px 0; }
  #sitebar .nav a + a { padding-left: 16px; margin-left: 16px; }
  #sitebar .nav a { flex: 0 0 auto; }
}

/* square corners everywhere */
.hero, .label, .tab, .search, .select, .notice, .alert, .jnote, .rel a, .btn, .row, .prow, .note { border-radius: 0; }
.fchip, .citychip, .chip, .pill, .vstat, .sb { border-radius: 2px; }

/* hero: label tag + serif heading with a rule */
.hero { border: 0; padding-top: 76px; min-height: 340px; }
.mast .rx.tag { position: absolute; top: 0; left: 0; max-width: none; background: var(--accent); color: var(--surface);
  padding: 9px 18px; font-size: 13px; font-weight: 600; letter-spacing: .1em; }
.mast h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 600; letter-spacing: -.005em; padding-bottom: 12px;
  border-bottom: 1px solid color-mix(in srgb, var(--ink) 60%, transparent); }
.mast p { color: var(--ink); font-size: 17px; }
@media (max-width: 640px) { .hero { padding-top: 160px; } }

/* condition tabs as cards with a solid icon square */
.tabs { gap: 10px; }
.tab { flex-direction: row; align-items: center; gap: 14px; padding: 14px; border: 0; box-shadow: none; }
.tab .ico { flex: none; width: 52px; height: 52px; display: grid; place-items: center; background: var(--c, var(--accent)); color: var(--surface); }
.tab .ico .sym { width: 26px; height: 26px; }
.tab .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tab .t { font-size: 21px; font-weight: 600; }
.tab .n { font-size: 13.5px; }
.tab:hover { box-shadow: inset 0 0 0 1px var(--line); }
.tab[aria-pressed="true"] { box-shadow: inset 0 -4px 0 var(--c, var(--accent)); }
@media (max-width: 560px) { .tab { gap: 10px; padding: 10px; } .tab .ico { width: 40px; height: 40px; } .tab .ico .sym { width: 22px; height: 22px; } .tab .t { font-size: 18px; } }

/* lists and cards */
.cond-h h2 { font-size: 28px; }
.grp-h { font-size: 12.5px; font-weight: 600; }
.rows, .plist-wrap { background: var(--surface); }
.row, .prow { padding-left: 14px; padding-right: 14px; }
.label { border: 0; }
.label h1 { font-weight: 600; }
.fact dt, .eyebrow, .about h3 { font-weight: 600; }
.src a, .about a, .vbox a, .notice a, .jnote a, .legend a { color: var(--link); }
.citychip { font-weight: 500; }
.citychip[aria-current="page"], .citychip[aria-current="page"] .n, .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.jnote { border-color: var(--band); }
.jnote strong { color: var(--band); font-family: var(--display); font-size: 18px; }
:root[data-theme="dark"] .jnote, :root[data-theme="dark"] .jnote strong { border-color: #B79BC7; color: #D9C6E3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .jnote { border-color: #B79BC7; } :root:not([data-theme="light"]) .jnote strong { color: #D9C6E3; } }

/* footer band */
footer { max-width: none; border: 0; background: var(--band); color: rgb(255 255 255 / .85); padding: 22px 26px; font-size: 14px; }
footer a { color: #fff; font-weight: 600; }
</style>

</head>

const CITYDOC = {"cities":[{"code":"bkk","file":"bangkok.json","name":{"en":"Bangkok","th":"กรุงเทพมหานคร"},"country":"TH","countryName":"Thailand","jurisdiction":"Thailand","dialCode":"+66","timezone":"Asia/Bangkok","currency":"THB","localLanguages":["th"],"uiLanguage":"th","notes":{"hiv":"PEP has to start within 72 hours. Go to a clinic that lists PEP or a hospital emergency department. The city's BKK Pride Clinic network lists PrEP and PEP as free.","adhd":"Amphetamine-based ADHD medicines such as Adderall and dexamphetamine are Category 1 narcotics in Thailand: not available, and they can't be brought in. Methylphenidate (e.g. Ritalin, Concerta) is a controlled Category 2 medicine and needs a prescription from a doctor in Thailand. Rules for lisdexamfetamine (Vyvanse) are unclear, so check with the Thai FDA before you travel.","diabetes":"Specialist centres only so far. Routine diabetes care is also available at public hospitals and BMA public health centres, usually covered by Thai public health insurance."},"noteSources":{"adhd":"https://thaiconsulateperth.com/wp-content/uploads/2016/09/FAQs_for_Drugs_Narcotics_19092016.pdf"}},{"code":"sha","file":"shanghai.json","name":{"en":"Shanghai","zh-Hans":"上海"},"country":"CN","countryName":"Mainland China","jurisdiction":"Mainland China","dialCode":"+86","timezone":"Asia/Shanghai","currency":"CNY","localLanguages":["zh-Hans"],"uiLanguage":"zh-Hans","notes":{"hiv":"Shanghai has more than 200 free HIV voluntary counselling and testing (VCT) sites. Find them through the city's official VCT finder or the 上海疾控 WeChat account. PEP must start within 72 hours.","adhd":"Only one public child psychiatry service is listed so far. Ask a local doctor which ADHD medicines are approved in Mainland China.","diabetes":"Large public teaching hospitals run diabetes and endocrine clinics; book through each hospital's official app or WeChat account."},"noteSources":{"hiv":"https://city.sina.cn/finance/2023-11-30/detail-imzwmafq5134469.d.html?vt=4&cid=76524&node_id=76524"}},{"code":"hkg","file":"hong-kong.json","name":{"en":"Hong Kong","zh-Hant":"香港"},"country":"HK","countryName":"Hong Kong SAR","jurisdiction":"Hong Kong SAR","dialCode":"+852","timezone":"Asia/Hong_Kong","currency":"HKD","localLanguages":["zh-Hant","en"],"uiLanguage":"zh-Hant","notes":{"hiv":"Reports from 2023 say Hong Kong has no public PrEP programme, so PrEP is mostly through private doctors and NGOs. For PEP within 72 hours, go to a public hospital emergency department (A&E), where doctors decide case by case, or to a private clinic (about HK$10,000–20,000 for the medicine). Department of Health clinics offer free or low-cost testing.","adhd":"Public child and adolescent psychiatry is through the Hospital Authority, usually by referral. Ask a local doctor which ADHD medicines are registered in Hong Kong.","diabetes":"Public diabetes care is through Hospital Authority clinics; specialist assessment centres may charge fees."},"noteSources":{"hiv":"https://aidsconcern.org.hk/en/?p=3641"}},{"code":"mfm","file":"macau.json","name":{"en":"Macau","zh-Hant":"澳門","pt":"Macau"},"country":"MO","countryName":"Macau SAR","jurisdiction":"Macau SAR","dialCode":"+853","timezone":"Asia/Macau","currency":"MOP","localLanguages":["zh-Hant","pt"],"uiLanguage":"zh-Hant","notes":{"hiv":"We found few public online sources for Macau. The Health Bureau (Serviços de Saúde) funds NGO HIV outreach, a hotline and rapid testing; call the Health Bureau to find a testing site, PrEP or PEP.","adhd":"Children's developmental assessments are coordinated by a joint government centre. Ask about ADHD assessment and medicines registered in Macau.","diabetes":"Public health centres and the public hospital provide chronic disease care; confirm diabetes services directly."}},{"code":"tpe","file":"taipei.json","name":{"en":"Taipei","zh-Hant":"臺北"},"country":"TW","countryName":"Taiwan","jurisdiction":"Taiwan","dialCode":"+886","timezone":"Asia/Taipei","currency":"TWD","localLanguages":["zh-Hant"],"uiLanguage":"zh-Hant","notes":{"hiv":"Taiwan CDC subsidises PrEP for eligible people, such as Taiwanese nationals aged 35 or under at high risk and partners of people living with HIV; others can pay for it themselves. Non-occupational PEP is self-paid (about NT$30,000) at hospital infectious-disease clinics. CDC hotline: 1922.","adhd":"A National Taiwan University Hospital page describes methylphenidate as the only stimulant ADHD medicine available in Taiwan; check with a local doctor for current options.","diabetes":"Taiwan runs a diabetes shared-care network across hospitals and clinics; ask for a certified diabetes educator."},"noteSources":{"hiv":"https://www.cdc.gov.tw/Category/QAPage/pzjkJa4dgVjdk6emQjM-3g"}},{"code":"sin","file":"singapore.json","name":{"en":"Singapore","zh-Hans":"新加坡"},"country":"SG","countryName":"Singapore","jurisdiction":"Singapore","dialCode":"+65","timezone":"Asia/Singapore","currency":"SGD","localLanguages":["en","zh-Hans"],"uiLanguage":"en","notes":{"hiv":"PrEP is prescribed at public clinics (DSC, NCID, NUH) and private GPs. Around 2022, guides quoted S$100–200 per visit plus the medicine. PEP must start within 72 hours.","adhd":"Public child ADHD care is mainly by referral from a polyclinic, CHAS GP or the school-linked REACH teams. Consultations and therapy can be subsidised by up to 70%.","diabetes":"Public diabetes centres are at the major hospitals; polyclinics manage most routine diabetes care."},"noteSources":{"adhd":"https://www.moh.gov.sg/newsroom/attention-deficit/"}},{"code":"sfo","file":"san-francisco.json","name":{"en":"San Francisco"},"country":"US","countryName":"United States","jurisdiction":"California, United States","dialCode":"+1","timezone":"America/Los_Angeles","currency":"USD","localLanguages":["en","es","zh-Hant"],"uiLanguage":"en","notes":{"hiv":"San Francisco City Clinic offers free HIV testing, PrEP, PEP and treatment, including for uninsured and undocumented people. PEP must start within 72 hours.","adhd":"Most ADHD care in the US goes through your primary care doctor or insurer; academic clinics often need a referral.","diabetes":"UCSF diabetes clinics need a referral from your doctor."},"noteSources":{"hiv":"https://www.sf.gov/cityclinic-location"}},{"code":"lax","file":"los-angeles.json","name":{"en":"Los Angeles","es":"Los Ángeles"},"country":"US","countryName":"United States","jurisdiction":"California, United States","dialCode":"+1","timezone":"America/Los_Angeles","currency":"USD","localLanguages":["en","es"],"uiLanguage":"en","notes":{"hiv":"LA County Public Health sexual health clinics are free (no copay) and offer HIV testing, PrEP and PEP. Book on 213-449-7009. PEP must start within 72 hours.","adhd":"Most ADHD care in the US goes through your primary care doctor or insurer; academic clinics often need a referral.","diabetes":"Specialist diabetes centres usually need a referral and insurance; LA County community clinics provide routine care."},"noteSources":{"hiv":"http://publichealth.lacounty.gov/chs/sexualhealthclinics/"}},{"code":"gdl","file":"guadalajara.json","name":{"en":"Guadalajara","es":"Guadalajara"},"country":"MX","countryName":"Mexico","jurisdiction":"Jalisco, Mexico","dialCode":"+52","timezone":"America/Mexico_City","currency":"MXN","localLanguages":["es"],"uiLanguage":"es","notes":{"hiv":"The state's specialised HIV and STI centre (CAE) on Calle Gigantes offers testing, PrEP, PEP and treatment. Jalisco health line: +52 33 3823 3220. IMSS members can ask IMSS about PrEP. PEP must start within 72 hours.","adhd":"Public child psychiatry is at the Hospital Civil; ask which ADHD medicines are available in Mexico.","diabetes":"The Hospital Civil endocrinology service runs a diabetes clinic and free screening days."},"noteSources":{"hiv":"https://teladejuicio.mx/jalisco-impulsa-jornada-estatal-para-la-deteccion-temprana-del-vih-pruebas-gratuitas-y-atencion-en-todo-el-estado/"}},{"code":"lis","file":"lisbon.json","name":{"en":"Lisbon","pt":"Lisboa"},"country":"PT","countryName":"Portugal","jurisdiction":"Portugal","dialCode":"+351","timezone":"Europe/Lisbon","currency":"EUR","localLanguages":["pt"],"uiLanguage":"pt","notes":{"hiv":"Community centres such as CheckpointLX offer free, anonymous testing. PrEP is prescribed through the national health service (SNS); in July 2025 Lisbon's hospital PrEP clinics had waits of a year or more. For PEP within 72 hours, go to a hospital emergency department.","adhd":"Public ADHD care is through SNS child psychiatry and psychiatry services, by referral from your family doctor.","diabetes":"APDP runs a large diabetes clinic that works alongside the SNS."},"noteSources":{"hiv":"https://www.rtp.pt/noticias/pais/listas-de-espera-em-lisboa-para-prevencao-do-vih-superiores-a-um-ano_n1669327"}}],"jurisdictionNotes":{"greater-china":{"cities":["sha","hkg","mfm","tpe"],"text":"Mainland China, Hong Kong, Macau and Taiwan are four separate jurisdictions. Each has its own laws, medicine regulator, lists of approved and controlled medicines, prescription rules and health insurance. A medicine that is approved or prescribed in one may be unavailable or restricted in another, and a prescription from one is generally not accepted in the others. Check the rules where you are."}}};

:"Centro de Salud LGBTQ+ \"Cuando estamos juntos\"","+351 213 816 161 is APDP's daily diabetes support line (nurses and doctors).":"El +351 213 816 161 es la línea diaria de apoyo de la APDP (enfermería y médicos).","1800 252 1324 is a confidential counselling line.":"El 1800 252 1324 es una línea de orientación confidencial.","1st Floor":"Planta 1","1–3 times daily":"1–3 veces al día","2nd Floor":"Planta 2","2nd Floor, next to the district office":"Planta 2, junto a la oficina del distrito","2–3 times daily":"2–3 veces al día","3rd Floor":"Planta 3","4th Floor":"Planta 4","4th Floor, Bangkok Hospital Building":"Planta 4, edificio Bangkok Hospital","4th Floor, Chiva Transitional Care Hospital (Bangkok Hospital campus)":"Planta 4, Chiva Transitional Care Hospital (campus de Bangkok Hospital)","5th Floor, Counter C (East lift)":"Planta 5, mostrador C (ascensor este)","A National Taiwan University Hospital page describes methylphenidate as the only stimulant ADHD medicine available in Taiwan; check with a local doctor for current options.":"Una página del Hospital de la Universidad Nacional de Taiwán describe el metilfenidato como el único estimulante para el TDAH disponible en Taiwán; consulta a un médico local las opciones actuales.","A-Backup":"A-Backup","ACCESS Center Mon–Fri 08:00–17:00 (Pacific); clinic runs on Wednesdays.":"Centro ACCESS lun–vie 08:00–17:00 (hora del Pacífico); la clínica atiende los miércoles.","ADHD and autism assessment packages by a consultant psychiatrist and nurse consultant, for children, adolescents and young adults. A charity programme offers medication and non-medication treatment for eligible children.":"Paquetes de evaluación de TDAH y autismo a cargo de un psiquiatra consultor y una enfermera consultora, para niños, adolescentes y adultos jóvenes. Un programa benéfico ofrece tratamiento con y sin medicación a niños que cumplen requisitos.","ADHD is listed under the Child and Adolescent Psychiatry Clinic. Adult ADHD is not mentioned; ask.":"El TDAH figura en la Clínica de Psiquiatría Infantil y Juvenil. No se menciona el TDAH en adultos; pregunta.","ADHD services are described for MedConsult as a whole; confirm which are offered at the Silom branch.":"Los servicios de TDAH se describen para MedConsult en general; confirma cuáles ofrece la sede de Silom.","AIDS Concern":"AIDS Concern","AIDS Concern Health Service Centre (MY PLACE)":"Centro de Salud de AIDS Concern (MY PLACE)","APDP runs a large diabetes clinic that works alongside the SNS.":"La APDP tiene una gran clínica de diabetes que trabaja junto al SNS.","APDP — Associação Protectora dos Diabéticos de Portugal":"APDP — Asociación Protectora de los Diabéticos de Portugal","APDP — Diabetes Portugal Clinic":"APDP — Clínica de Diabetes de Portugal","APLA Health":"APLA Health","APLA Health — Gleicher/Chen Health Center":"APLA Health — Centro de Salud Gleicher/Chen","APLA Health — Olympic":"APLA Health — Olympic","APLA Health — Watts / 120th Street":"APLA Health — Watts / calle 120","Abbreviation":"Abreviatura","About 30 minutes before meals":"Unos 30 minutos antes de las comidas","Action for AIDS Singapore":"Action for AIDS Singapur","Action for AIDS — Anonymous HIV Testing and Counselling":"Action for AIDS — Prueba y Consejería Anónima del VIH","Address and phone are on the hospital's main page, not the centre page.":"La dirección y el teléfono están en la página principal del hospital, no en la del centro.","Adults 18+. Multidisciplinary team including diabetes educators and dietitians. Referral needed.":"Adultos de 18 años o más. Equipo multidisciplinar con educadores en diabetes y dietistas. Requiere derivación.","Adults and children (paediatrics up to 18, young adults 18–25), insulin pump programme, nurse-led education, diabetic foot department with home visits. Works alongside the SNS; check what is covered.":"Adultos y niños (pediatría hasta los 18, adultos jóvenes de 18 a 25), programa de bomba de insulina, educación a cargo de enfermería y departamento de pie diabético con visitas a domicilio. Trabaja junto al SNS; consulta qué está cubierto.","Adults only; not for people who smoke or have chronic lung disease.":"Solo adultos; no apta para fumadores ni personas con enfermedad pulmonar crónica.","Adults with type 2 diabetes only. New in 2026.":"Solo adultos con diabetes tipo 2. Nuevo en 2026.","Adventist Medical Center — Child and Adolescent Development Center":"Adventist Medical Center — Centro de Desarrollo Infantil y Juvenil","Ages 0–26. Team includes endocrinologists, psychologists, nurses, diabetes educators, social workers and dietitians. Referral needed.":"De 0 a 26 años. Equipo con endocrinólogos, psicólogos, enfermería, educadores en diabetes, trabajo social y dietistas. Requiere derivación.","Alpha-2 adrenergic agonist":"Agonista adrenérgico alfa-2","Alpha-2A adrenergic agonist":"Agonista adrenérgico alfa-2A","Also approved for heart failure and chronic kidney disease.":"También aprobado para la insuficiencia cardíaca y la enfermedad renal crónica.","Also approved for moderate to severe binge eating disorder in adults.":"También aprobado para el trastorno por atracón moderado a grave en adultos.","Also approved to reduce cardiovascular and kidney risk in certain adults.":"También aprobado para reducir el riesgo cardiovascular y renal en ciertos adultos.","Also at 1600 Owens Street (Mission Bay).":"También en 1600 Owens Street (Mission Bay).","Also covers North Hollywood Health Center, which is closed. Glendale is a separate city next to Los Angeles.":"También cubre el North Hollywood Health Center, que está cerrado. Glendale es una ciudad aparte junto a Los Ángeles.","Also used to reduce perinatal (mother-to-child) transmission.":"También se usa para reducir la transmisión perinatal (de madre a hijo).","Amphetamine":"Anfetamina","Amphetamine-based ADHD medicines such as Adderall and dexamphetamine are Category 1 narcotics in Thailand: not available, and they can't be brought in. Methylphenidate (e.g. Ritalin, Concerta) is a controlled Category 2 medicine and needs a prescription from a doctor in Thailand. Rules for lisdexamfetamine (Vyvanse) are unclear, so check with the Thai FDA before you travel.":"Los medicamentos para el TDAH a base de anfetamina, como Adderall y la dexanfetamina, son estupefacientes de categoría 1 en Tailandia: no están disponibles y no se pueden ingresar. El metilfenidato (p. ej., Ritalin, Concerta) es un medicamento controlado de categoría 2 y necesita receta de un médico en Tailandia. Las normas sobre la lisdexanfetamina (Vyvanse) no están claras; consulta a la FDA tailandesa antes de viajar.","Amylin analog":"Análogo de amilina","Amylin analog used with mealtime insulin to smooth blood sugar after meals.":"Análogo de amilina que se usa con la insulina de las comidas para estabilizar la glucosa después de comer.","Anti-CD3 monoclonal antibody":"Anticuerpo monoclonal anti-CD3","Antiretroviral treatment and HIV drug-resistance testing; free anonymous HIV screening by appointment (4F); one of three Taipei hospitals running the city PrEP subsidy programme. Taiwan CDC subsidises PrEP for eligible people (e.g. Taiwanese nationals aged 35 or under at high risk, partners of people living with HIV); others can pay themselves. Places are limited. CDC hotline 1922.":"Tratamiento antirretroviral y prueba de resistencia del VIH; cribado anónimo y gratuito del VIH con cita (4.ª planta); uno de los tres hospitales de Taipéi del programa municipal de subsidio de PrEP. Los CDC de Taiwán subvencionan la PrEP a quien cumple requisitos (p. ej., taiwaneses de 35 años o menos con alto riesgo, parejas de personas con VIH); el resto puede pagarla. Plazas limitadas. Línea de los CDC: 1922.","Appointment-only PrEP clinic. Around 2022, guides quoted S$100–200 per consultation, with branded PrEP at about S$300–400 per month at pharmacies; generic PrEP can be bought online with a prescription.":"Clínica de PrEP solo con cita. Hacia 2022 las guías hablaban de S$100–200 por consulta y de S$300–400 al mes por la PrEP de marca en farmacias; la PrEP genérica se puede comprar en línea con receta.","Approved for ages 13 and older.":"Aprobado a partir de los 13 años.","Approved for ages 6 and older.":"Aprobado a partir de los 6 años.","Approved for children 10 and older.":"Aprobado para niños de 10 años o más.","Approved for children 6–17.":"Aprobado para niños de 6 a 17 años.","Approved for children and adolescents 6–17.":"Aprobado para niños y adolescentes de 6 a 17 años.","Approved for patients 6 and older weighing at least 20 kg. New in 2026.":"Aprobado para pacientes de 6 años o más que pesen al menos 20 kg. Nuevo en 2026.","Associação Positivo":"Asociación Positivo","At the start of a meal or within 20 minutes after":"Al empezar a comer o en los 20 minutos siguientes","At the start of meals":"Al empezar las comidas","Atazanavir pre-boosted with cobicistat; taken with other HIV medicines.":"Atazanavir ya potenciado con cobicistat; se toma con otros medicamentos contra el VIH.","Attachment Inhibitor":"Inhibidor de la unión","Attachment inhibitors":"Inhibidores de la unión","Available":"Disponible","BGCA Project Touch — Diamond Hill":"BGCA Project Touch — Diamond Hill","BGCA Project Touch — Tai Po":"BGCA Project Touch — Tai Po","BGCA Project Touch — Tuen Mun":"BGCA Project Touch — Tuen Mun","BGCA Project Touch — Wan Chai":"BGCA Project Touch — Wan Chai","BMA Public Health Center 20 Pom Prap Sattru Phai":"Centro de Salud Pública 20 de la BMA (Pom Prap Sattru Phai)","BMA Public Health Center 20 Pom Prap Sattru Phai — BKK Pride Clinic":"Centro de Salud Pública 20 de la BMA (Pom Prap Sattru Phai)","BMA Public Health Center 21 Wat That Thong":"Centro de Salud Pública 21 de la BMA (Wat That Thong)","BMA Public Health Center 21 Wat That Thong — BKK Pride Clinic":"Centro de Salud Pública 21 de la BMA (Wat That Thong)","BMA Public Health Center 22 Wat Pak Bo":"Centro de Salud Pública 22 de la BMA (Wat Pak Bo)","BMA Public Hea
