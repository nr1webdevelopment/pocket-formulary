P ฟรี","PI":"PI","Pacoima Health Center — Sexual Health Clinic":"Pacoima Health Center — คลินิกสุขภาพทางเพศ","Paediatric clinic; scope includes attention and behavioural disorders including ADHD. Medication not mentioned.":"คลินิกเด็ก ดูแลความผิดปกติด้านสมาธิและพฤติกรรมรวมถึงสมาธิสั้น ไม่ได้กล่าวถึงยา","Part of Taiwan CDC's one-stop anonymous rapid HIV screening (2019) and one of three Taipei hospitals named for the city PrEP subsidy (2021). Non-occupational PEP in Taiwan is self-paid (about NT$30,000) at a hospital infectious-disease clinic that offers it; start within 72 hours.":"เข้าร่วมบริการตรวจเอชไอวีแบบรวดเร็วไม่ระบุตัวตนครบในที่เดียวของ CDC ไต้หวัน (2019) และเป็นหนึ่งในโรงพยาบาล 3 แห่งในไทเปที่ร่วมโครงการอุดหนุน PrEP (2021) PEP ที่ไม่ได้มาจากการทำงานในไต้หวันต้องจ่ายเอง (ประมาณ 30,000 ดอลลาร์ไต้หวัน) ที่คลินิกโรคติดเชื้อของโรงพยาบาลที่ให้บริการ ต้องเริ่มภายใน 72 ชั่วโมง","Pediatric dispersible formulation of dolutegravir.":"โดลูทิกราเวียร์สูตรเม็ดละลายน้ำสำหรับเด็ก","Pediatric dispersible formulation of rilpivirine.":"ริลพิไวรีนสูตรเม็ดละลายน้ำสำหรับเด็ก","Pediatric dispersible version of Triumeq.":"Triumeq สูตรเม็ดละลายน้ำสำหรับเด็ก","Pediatric formulation":"สูตรสำหรับเด็ก","Pediatric-dose version of Prezcobix.":"Prezcobix ขนาดสำหรับเด็ก","Peer-led screening for HIV, syphilis and hepatitis B and C, and PrEP counselling by appointment, aimed at migrants and sex workers.":"ตรวจคัดกรองเอชไอวี ซิฟิลิส และไวรัสตับอักเสบบีและซีโดยเพื่อนช่วยเพื่อน และให้คำปรึกษาเรื่อง PrEP เมื่อนัดหมาย สำหรับผู้ย้ายถิ่นและพนักงานบริการ","Per HHS guidelines, used as a PK enhancer rather than as an active antiretroviral.":"ตามแนวทางของ HHS ใช้เป็นยาเสริมเภสัชจลนศาสตร์ ไม่ใช่ยาต้านไวรัสหลัก","Pharmacokinetic Enhancer":"ยาเสริมเภสัชจลนศาสตร์","Pharmacokinetic enhancers":"ยาเสริมเภสัชจลนศาสตร์","Phone also works on WhatsApp.":"เบอร์นี้ติดต่อทาง WhatsApp ได้ด้วย","Portugal":"โปรตุเกส","Post-Attachment Inhibitor":"ยายับยั้งหลังการเกาะติด","Post-attachment inhibitors":"ยากลุ่มยับยั้งหลังการเกาะติด","PrEP":"PrEP","PrEP and HIV treatment for people experiencing or at risk of homelessness. Uninsured, undocumented and public insurance.":"PrEP และการรักษาเอชไอวีสำหรับคนไร้บ้านหรือเสี่ยงไร้บ้าน รับผู้ไม่มีประกัน ผู้ไม่มีเอกสาร และผู้มีประกันรัฐ","PrEP and HIV treatment including long-acting injections. For patients assigned to this clinic by their public insurance plan; also serves undocumented people.":"PrEP และการรักษาเอชไอวีรวมถึงยาฉีดออกฤทธิ์ยาว สำหรับผู้ป่วยที่ประกันรัฐกำหนดให้มาคลินิกนี้ และให้บริการผู้ไม่มีเอกสารด้วย","PrEP indication excludes people at risk through receptive vaginal sex.":"ข้อบ่งใช้ PrEP ไม่ครอบคลุมผู้ที่เสี่ยงจากการมีเพศสัมพันธ์ทางช่องคลอดแบบฝ่ายรับ","PrEP is prescribed at public clinics (DSC, NCID, NUH) and private GPs. Around 2022, guides quoted S$100–200 per visit plus the medicine. PEP must start within 72 hours.":"สั่งจ่าย PrEP ได้ที่คลินิกรัฐ (DSC, NCID, NUH) และแพทย์ทั่วไปเอกชน ราวปี 2022 คู่มือระบุค่าตรวจครั้งละประมาณ 100–200 ดอลลาร์สิงคโปร์ บวกค่ายา ต้องเริ่ม PEP ภายใน 72 ชั่วโมง","PrEP/STI Clinic — Sete Rios (ULS Santa Maria)":"คลินิก PrEP/โรคติดต่อทางเพศสัมพันธ์ — เซเต้ริออส (ULS Santa Maria)","Primary care, HIV testing, STI testing and treatment, transgender services. Ask whether PrEP/PEP are prescribed on site.":"การดูแลปฐมภูมิ ตรวจเอชไอวี ตรวจและรักษาโรคติดต่อทางเพศสัมพันธ์ บริการสำหรับคนข้ามเพศ ควรสอบถามว่าสั่งจ่าย PrEP/PEP ที่นี่หรือไม่","Princess Margaret Hospital — Infectious Disease Special Medical Clinic":"โรงพยาบาลพรินเซสมาร์กาเร็ต — คลินิกการแพทย์พิเศษโรคติดเชื้อ","Private hospital with multilingual staff. For PEP, go straight to the 24-hour emergency department; PEP must start within 72 hours (ideally within 2).":"โรงพยาบาลเอกชนที่มีเจ้าหน้าที่หลายภาษา หากต้องการ PEP ให้ไปห้องฉุกเฉิน 24 ชั่วโมงได้เลย ต้องเริ่ม PEP ภายใน 72 ชั่วโมง (ดีที่สุดภายใน 2 ชั่วโมง)","Prodrug of the protease inhibitor amprenavir.":"ยาตั้งต้นของยายับยั้งโปรตีเอสแอมพรีนาเวียร์","Prodrug the body converts into dextroamphetamine, giving function prow(p) {
  const badges = PCOND[pstate.cond].row.filter(k => p.services[k] === true)
    .map(k => `<span class="sb ${p.services.basis === "site" ? "solid" : "net"}" title="${esc(svcLabel(k))}">${esc(svcShort(k))}</span>`).join("");
  const sub = p.network ? (tc(p.location.locationNote) || t("type_" + p.type)) : `${t("type_" + p.type)} · ${where(p)}`;
  const n2 = pname2(p);
  return `<a class="prow" href="#provider/${p.id}">
    <span class="nm"><b>${esc(pname(p))}</b>${n2 ? `<span class="th">${esc(n2)}</span>` : ""}</span>
    <span class="where">${esc(sub)}</span>
    <span class="badges">${badges}${vpill(p)}</span></a>`;
}

function providerProfile(p) {
  const s = p.services, L = p.location, C = p.contact, city = CITIES[p.city];
  const main = p.conditions.includes(pstate.cond) ? pstate.cond : p.conditions[0];
  const svcItem = k => {
    const v = s[k];
    const [cls, ic, txt] = v === true ? (s.basis === "site" ? ["yes", "✓", t("svcSite")] : s.basis === "network" ? ["net", "✓", t("svcNetwork")] : ["net", "✓", t("svcThird")])
      : v === false ? ["no", "✕", t("svcNo")] : ["unk", "?", t("svcUnknown")];
    return `<li><span class="ic ${cls}" aria-hidden="true">${ic}</span><span><b>${esc(svcLabel(k))}</b><small>${esc(txt)}</small></span></li>`;
  };
  const svcKeys = Object.keys(SVC).filter(k => p.conditions.includes(SVC[k]) && (k in s));
  const addrs = [...new Set([L.address[LANG], ...city.localLanguages.map(l => L.address[l]), L.address.en].filter(Boolean))];
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([cleanEn(p), L.address.en || Object.values(L.address).find(Boolean), city.name.en].filter(Boolean).join(", "));
  const yn = v => v === true ? t("yes") : v === false ? t("no") : t("notConfirmed");
  const facts = [
    [t("factAddress"), addrs.join("\n") || t("addrUnknown")],
    [t("factWhere"), tc(L.locationNote)], [t("factTransit"), tc(L.nearestTransit)],
    [t("factHours"), tc(p.hours) || t("hoursUnknown")],
    [t("factCost"), p.access.cost ? t("cost_" + p.access.cost) : t("notConfirmed")],
    [t("factFor"), p.populationFocus.map(f => t("focus_" + f)).join(", ")],
    [t("factWalkIn"), p.access.walkIn === false ? t("apptNeeded") : yn(p.access.walkIn)],
    [t("factForeigners"), yn(p.access.foreignersAccepted)],
    [t("factLanguages"), p.access.languages.join(", ") || t("notConfirmed")],
    [t("factRunBy"), p.network ? t("runByNetwork", { org: tc(p.organization), network: p.network }) : tc(p.organization)],
  ].filter(([, v]) => v);
  if (facts.length % 2) facts.push([t("factType"), t("type_" + p.type)]);
  const prepMeds = p.conditions.includes("hiv") && s.prep ? DRUGS.filter(d => (d.extra || []).some(e => e[0] === "Used for" && /PrEP/.test(e[1]))) : [];
  const issue = `${REPO}/issues/new?title=${encodeURIComponent("Correction: " + p.id)}&body=${encodeURIComponent("What's wrong or out of date?\n\n")}`;
  const n2 = pname2(p);
  app.innerHTML = `
    ${topbar("prov")}
    <a class="back" href="#providers/${p.city}/${main}">${esc(t("backProv", { cond: condName(main), city: cityName(p.city) }))}</a>
    <article class="label" style="--c: var(--prov)">
      <div class="label-top">
        <span class="eyebrow">${p.conditions.map(condName).join(" · ")} · ${esc(t("type_" + p.type))} · ${esc(cityName(p.city))}</span>
        <h1>${esc(pname(p))}</h1>
        ${n2 ? `<div class="generic">${esc(n2)}</div>` : ""}
        <div class="chips">${vpill(p)}${p.network ? `<span class="chip">${esc(p.network)}</span>` : ""}${p.access.cost ? `<span class="chip">${t("cost_" + p.access.cost)}</span>` : ""}</div>
      </div>
      <div class="actions">
        ${C.phone.map(ph => `<a class="btn" href="tel:${tel(ph, p.city)}">${esc(t("call", { phone: ph }))}</a>`).join("")}
        ${C.line ? `<a class="btn" href="https://line.me/R/ti/p/${encodeURIComponent(C.line)}" target="_blank" rel="noopener">${esc(t("lineBtn", { id: C.line }))}</a>` : ""}
        ${C.booking ? `<a class="btn" href="${esc(C.booking)}" target="_blank" rel="noopener">${t("book")}</a>` : ""}
        ${C.website ? `<a class="btn" href="${esc(C.website)}" target="_blank" rel="noopener">${t("website")}</a>` : ""}
        ${C.email ? `<a class="btn" href="mailto:${esc(C.email)}">${t("emailBtn")}</a>` : ""}
        <a class="btn" href="${maps}" target="_blank" rel="noopener">${t("directions")}</a>
      </div>
      <ul class="svc-list">${svcKeys.map(svcItem).join("")}</ul>
      <dl class="facts">${facts.map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd style="white-space:pre-line">${esc(v)}</dd></div>`).join("")}</dl>
      ${s.note || p.notes ? `<div class="about">${s.note ? `<div class="note"><strong>${t("aboutServices")}</strong> ${esc(tc(s.note))}</div>` : ""}${p.notes ? `<p>${esc(tc(p.notes))}</p>` : ""}</div>` : ""}
    </article>
    ${jurisdictionFor(p.city) ? `<div class="jnote" role="note" style="margin-top:20px"><strong>${t("jurisdictionTitle")}</strong><p>${esc(tc(jurisdictionFor(p.city).text))}</p></div>` : ""}
    ${prepMeds.length ? `<section class="related" style="--c: var(--hiv)"><h3>${t("prepMeds")}</h3>
      <div class="rel">${prepMeds.map(r => `<a href="#${r.slug}">${esc(r.brand)} <span>${esc(r.generic)}</span></a>`).join("")}</div>
      <p class="blurb">${t("prepMedsNote")}</p></section>` : ""}
    ${p.conditions.includes("adhd") ? `<section class="related"><h3>${t("adhdMeds")}</h3>
      <div class="rel"><a href="#adhd">${t("seeAllAdhd")}</a></div><p class="blurb">${t("adhdMedsNote")}</p></section>` : ""}
    ${p.conditions.includes("diabetes") ? `<section class="related"><h3>${t("dmMeds")}</h3>
      <div class="rel"><a href="#diabetes">${t("seeAllDm")}</a></div></section>` : ""}
    <div class="vbox">
      <strong>${t("verification")}</strong> ${vpill(p)}
      <dl>
        <dt>${t("sourceChecked")}</dt><dd>${fmtDate(p.verification.sourceChecked)}</dd>
        <dt>${t("confirmedWith")}</dt><dd>${p.verification.lastVerified ? esc(t("verifiedOn", { date: fmtDate(p.verification.lastVerified), method: t("method_" + p.verification.method) })) : t("notYet")}</dd>
        ${p.verification.nextReviewDue ? `<dt>${t("nextCheck")}</dt><dd>${fmtDate(p.verification.nextReviewDue)}</dd>` : ""}
      </dl>
      <a href="${issue}" target="_blank" rel="noopener">${t("report")}</a>
    </div>
    <div class="src">${t("sourcesLabel")}<ul>${p.sources.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>${x.publisher ? ` · ${esc(x.publisher)}` : ""}</li>`).join("")}</ul></div>`;
  window.scrollTo(0, 0);
}

function whereToGet(d) {
  const city = pstate.city, place = tc(CITIES[city].jurisdiction);
  const count = k => PROVIDERS.filter(p => p.city === city && p.services[k] === true).length;
  const link = (path, label, n) => `<a href="#providers/${city}/${path}">${esc(label)} <span>${n}</span></a>`;
  let links = [], note = "";
  if (d.condition === "hiv") {
    const used = ((d.extra || []).find(e => e[0] === "Used for") || [])[1] || "";
    if (/PrEP/.test(used)) links.push(link("prep", t("prepProviders"), count("prep")));
    if (/Treatment/.test(used)) links.push(link("art", t("artProviders"), count("art")));
    note = esc(t("noteHivBrands"));
  } else if (d.condition === "adhd") {
    links.push(link("adhd", t("adhdProviders"), inCity("adhd", city).length));
    const g = d.generic.toLowerCase();
    note = city === "bkk"
      ? (/lisdexamfetamine/.test(g) ? `<strong>${esc(t("thLisdex"))}</strong>` : /amphetamine/.test(g) ? `<strong>${esc(t("thAmphetamine"))}</strong>` : /^methylphenidate/.test(g) ? esc(t("thMph")) : esc(t("noteAskAvailable", { place })))
      : esc(t("noteAskAvailable", { place }));
  } else {
    links.push(link("diabetes", t("dmProviders"), inCity("diabetes", city).length));
    note = esc(t("noteAskAvailable", { place }));
  }
  if (!links.length) return "";
  return `<section class="related" style="--c: var(--prov)"><h3>${esc(t("whereCare", { city: cityName(city) }))}</h3>
    <div class="rel">${links.join("")}<a href="#providers" class="ghost">${t("changeCity")}</a></div><p class="blurb">${note}</p></section>`;
}

/* ---------------- routing ---------------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const onList = document.getElementById("list") || document.getElementById("plist");
  if (onList) scrollMem[document.getElementById("plist") ? "prov" : "med"] = window.scrollY;
  document.title = t("siteTitle");
  if (h.startsWith("provider/") && PBY[h.slice(9)]) {
    const p = PBY[h.slice(9)];
    pstate.city = p.city;
    if (!p.conditions.includes(pstate.cond)) pstate.cond = p.conditions[0];
    providerProfile(p);
  } else if (h === "providers" || h.startsWith("providers/")) {
    const segs = h.split("/").slice(1);
    let city = pstate.city, cond = pstate.cond, svc = null;
    for (const s of segs) {
      if (CITIES[s]) city = s;
      else if (PCOND[s]) cond = s;
      else if (SVC[s]) { cond = SVC[s]; svc = s; }
    }
    if (city !== pstate.city || cond !== pstate.cond || svc) { pstate.svc = new Set(svc ? [svc] : []); scrollMem.prov = 0; }
    if (city !== pstate.city) pstate.q = "";
    pstate.city = city; pstate.cond = cond; store.set("pf-city", city);
    providerShell();
    window.scrollTo(0, scrollMem.prov);
  } else if (BY[h]) {
    profile(BY[h]);
  } else {
    if (COND[h] || h === "all") state.cond = h;
    shell();
    window.scrollTo(0, scrollMem.med);
  }
  renderFooter();
}
window.addEventListener("hashchange", route);
route();
</script>
