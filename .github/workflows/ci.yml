name: Validate data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - name: Rebuild dist/
        run: python scripts/build_dist.py
      - name: Validate sources and dist/
        run: python scripts/validate.py
      - name: dist/ must match sources (run scripts/build_dist.py and commit)
        run: git diff --exit-code -- dist/
