name: Validate data

# Pull requests: data must be valid and the built files must match it.
# Pushes to main are checked (and rebuilt) by deploy.yml, because saves from the admin dashboard only change data/.
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - name: Rebuild dist/
        run: python scripts/build_dist.py
      - name: Validate sources and dist/
        run: python scripts/validate.py
      - name: dist/ and api/ must match sources (run scripts/build_dist.py and commit)
        run: git diff --exit-code -- dist/ api/
