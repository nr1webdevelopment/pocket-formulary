name: Publish website and API

# Publishes the website (index.html), the static JSON API (api/) and the dataset files (dist/, schema/)
# to GitHub Pages on every push to main. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - name: Check data and API are up to date
        run: |
          python scripts/build_dist.py
          python scripts/validate.py
          git diff --exit-code -- dist/ api/
      - name: Assemble site (only public files)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r api dist schema _site/
          mkdir -p _site/assets && cp assets/logo*.svg _site/assets/
          cp LICENSE.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
