<style>
/* Layout: a pharmacy-label reference. One narrow column; condition colors come from each disease's awareness symbol
   (HIV red ribbon, ADHD orange ribbon, diabetes blue circle). List view <-> profile view via #slug. */
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --ink: #15202B; --muted: #5A6774; --line: #DAE0E6; --soft: #E9EDF1;
  --hiv: #C8102E; --adhd: #C2600A; --diabetes: #1C64C8; --warn: #8A5A00; --warn-bg: #FFF2D6;
  --prov: #0E7C6B; --ok: #1F7A35; --ok-bg: #E2F3E6; --alert: #A3122A; --alert-bg: #FDE8EB;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E141A; --surface: #151D25; --ink: #E5EBF0; --muted: #94A2AF; --line: #27323D; --soft: #1C2630;
  --hiv: #FF6070; --adhd: #F39B47; --diabetes: #6AA6FF; --warn: #F2C46B; --warn-bg: #3A2C10;
  --prov: #3CC8AE; --ok: #7BD88F; --ok-bg: #173322; --alert: #FF8A99; --alert-bg: #3A1520; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #151D25; --ink: #E5EBF0; --muted: #94A2AF; --line: #27323D; --soft: #1C2630;
  --hiv: #FF6070; --adhd: #F39B47; --diabetes: #6AA6FF; --warn: #F2C46B; --warn-bg: #3A2C10;
  --prov: #3CC8AE; --ok: #7BD88F; --ok-bg: #173322; --alert: #FF8A99; --alert-bg: #3A1520; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--diabetes); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sym { width: 18px; height: 18px; flex: none; }

/* masthead */
.mast { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.mast .rx { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--prov); font-weight: 500; }
.mast h1 { font-size: clamp(32px, 6.4vw, 52px); line-height: 1.02; letter-spacing: -.02em; }
.mast p { margin: 0; color: var(--muted); max-width: 46ch; font-size: 16px; }

/* hero: solid text panel, image (assets/hero.*) in its own panel on the right. No gradients. */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); padding: 0; background: var(--surface); }
.hero-txt { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 76px 40px 36px; min-height: 340px; }
.hero-img { background: __HERO__ center / cover no-repeat; min-height: 340px; }
.hero.noimg { grid-template-columns: minmax(0, 1fr); }
.hero.noimg .hero-img { display: none; }
.hero.noimg .hero-txt > * { max-width: 620px; }
.hero.noimg .hero-txt { min-height: 0; padding-top: 84px; }
@media (max-width: 640px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-img { order: -1; min-height: 190px; }
  .hero-txt { min-height: 0; padding: 24px 20px 24px; }
  .hero.noimg .hero-txt { padding-top: 64px; }
}

/* brand */
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 32px; height: 32px; flex: none; border-radius: 8px; }
.topbar-end { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
@media (max-width: 640px) {
  .topbar-end { display: contents; }
  .topbar .brand { order: 1; }
  .topbar .langsel { order: 2; }
  .topbar .nav { order: 3; flex: 1 1 100%; }
  .topbar .nav a { flex: 1; text-align: center; }
}

/* condition tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tab { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 10px; cursor: pointer; font: inherit; min-width: 0; }
.tab .t { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.tab .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tab:hover { border-color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--c, var(--ink)); box-shadow: inset 0 0 0 1px var(--c, var(--ink)); }
@media (max-width: 560px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 8px; }
.search { flex: 1 1 260px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; }
.search::placeholder { color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
.blurb { color: var(--muted); font-size: 14px; margin: 4px 0 0; min-height: 1.5em; }

/* list */
.cond-block { margin-top: 30px; }
.cond-h { display: flex; align-items: center; gap: 10px; color: var(--c); padding-bottom: 8px; border-bottom: 2px solid var(--c); }
.cond-h h2 { font-size: 24px; color: var(--ink); }
.cond-h .n { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.grp-h { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  margin: 18px 0 4px; display: flex; gap: 8px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 170px; gap: 4px 16px; align-items: baseline;
  padding: 10px 8px; border-bottom: 1px solid var(--line); text-decoration: none; border-radius: 6px; }
.row:hover { background: var(--soft); }
.row .nm { min-width: 0; }
.row .nm b { font-weight: 600; }
.row .gen { color: var(--muted); margin-left: 8px; font-size: 14px; }
.row .cls { color: var(--muted); font-size: 13.5px; min-width: 0; }
.row .yr { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; }
@media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .cls { grid-column: 1 / -1; grid-row: 2; } .row .gen { display: block; margin: 0; } }
.pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px;
  border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.pill.disc { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.pill.new { color: var(--c); }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* profile */
.back { display: inline-flex; align-items: center; gap: 6px; font: 500 14px var(--body); color: var(--muted);
  background: none; border: 0; padding: 6px 0; cursor: pointer; margin-bottom: 18px; }
.back:hover { color: var(--ink); }
.label { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.label-top { border-top: 6px solid var(--c); padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--c); font-family: var(--mono); font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase; }
.label h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1; letter-spacing: -.015em; }
.generic { font-size: 18px; color: var(--muted); }
.chips:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--soft); color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); margin: 0; }
.fact { padding: 14px 24px; border-bottom: 1px solid var(--line); min-width: 0; }
.fact:nth-child(odd) { border-right: 1px solid var(--line); }
.fact dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.fact dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } .fact:nth-child(odd) { border-right: 0; } .label-top, .fact { padding-left: 18px; padding-right: 18px; } }
.about { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
.about h3 { font-size: 15px; font-family: var(--mono); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.about p { margin: 4px 0 0; max-width: 65ch; }
.note { background: var(--warn-bg); color: var(--ink); padding: 12px 14px; border-radius: 8px; }
.related { margin-top: 28px; }
.related h3 { font-size: 18px; margin-bottom: 10px; }
.rel { display: flex; flex-wrap: wrap; gap: 8px; }
.rel a { text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 14px; }
.rel a:hover { border-color: var(--c); }
.rel a span { color: var(--muted); }
.src { margin-top: 28px; font-size: 13px; color: var(--muted); }
.src a { color: var(--ink); }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .label { animation: rise .25s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

/* section nav (Medicines / Providers) */
.nav { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 10px; margin: 4px 0 18px; max-width: 100%; }
.nav a { text-decoration: none; padding: 7px 14px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.nav a span { font-family: var(--mono); font-weight: 400; font-size: 12px; margin-left: 6px; }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

/* providers */
.alert { background: var(--alert-bg); border-left: 4px solid var(--alert); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.alert strong { color: var(--alert); }
.alert p { margin: 4px 0 10px; max-width: 70ch; }
.btn { font: 600 14px var(--body); padding: 7px 12px; border-radius: 8px; border: 1px solid currentColor; background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--c, var(--ink)); }
.notice { background: var(--warn-bg); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
.svc-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { font: 500 13.5px var(--body); padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.fchip:hover { border-color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--prov); border-color: var(--prov); color: #fff; }
:root[data-theme="dark"] .fchip[aria-pressed="true"] { color: #0E141A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fchip[aria-pressed="true"] { color: #0E141A; } }
.select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; max-width: 100%; }
.legend { font-size: 13px; color: var(--muted); margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.prow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 320px; gap: 4px 16px; align-items: center;
  padding: 11px 8px; border-bottom: 1px solid var(--line); text-decoration: none; border-radius: 6px; }
.prow:hover { background: var(--soft); }
.prow .nm { min-width: 0; }
.prow .nm b { font-weight: 600; display: block; }
.prow .th { color: var(--muted); font-size: 13px; }
.prow .where { color: var(--muted); font-size: 13.5px; min-width: 0; }
.prow .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
@media (max-width: 640px) { .prow { grid-template-columns: minmax(0, 1fr); } .prow .badges { justify-content: flex-start; } }
.sb { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--prov); color: var(--prov); white-space: nowrap; }
.sb.solid { background: var(--prov); color: var(--surface); }
.sb.net { border-style: dashed; }
.vstat { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.vstat.unverified, .vstat.needs_review { color: var(--warn); background: var(--warn-bg); }
.vstat.verified { color: var(--ok); background: var(--ok-bg); }
.vstat.closed { color: var(--muted); background: var(--soft); text-decoration: line-through; }
.svc-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.svc-list li { display: flex; gap: 10px; align-items: flex-start; padding: 12px 24px; border-bottom: 1px solid var(--line); min-width: 0; }
.svc-list li:nth-child(odd) { border-right: 1px solid var(--line); }
.svc-list .ic { font-family: var(--mono); font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; }
.ic.yes { background: var(--prov); color: var(--surface); }
.ic.net { border: 1.5px dashed var(--prov); color: var(--prov); }
.ic.no { background: var(--soft); color: var(--muted); }
.ic.unk { border: 1.5px solid var(--line); color: var(--muted); }
.svc-list b { display: block; font-weight: 600; }
.svc-list small { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .svc-list { grid-template-columns: minmax(0, 1fr); } .svc-list li:nth-child(odd) { border-right: 0; } .svc-list li { padding-left: 18px; padding-right: 18px; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 20px; }
@media (max-width: 560px) { .actions { padding-left: 18px; padding-right: 18px; } }
.vbox { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 20px; background: var(--surface); font-size: 14px; }
.vbox dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; }
.vbox dt { color: var(--muted); }
.vbox dd { margin: 0; }
.src ul { margin: 6px 0 0; padding-left: 18px; }
.src li { margin: 2px 0; }

/* i18n + cities */
:root { --body: "Public Sans", "Helvetica Neue", Arial, "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Noto Sans Thai", "Thonburi", system-ui, sans-serif; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar .nav { margin: 0; }
.langsel { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.langsel svg { width: 18px; height: 18px; }
.langsel select { font: 500 14px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.citybar { margin: 0 0 16px; padding: 0; border: 0; }
.citylabel { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.cityregion { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
.cityregion .rlabel { flex: 0 0 auto; min-width: 84px; font-size: 13px; color: var(--muted); }
.citychip { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.2; }
.citychip:hover { border-color: var(--ink); }
.citychip .n { font: 500 12px var(--mono); color: var(--muted); }
.citychip[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }

@media (max-width: 600px) { .cityregion .rlabel { flex-basis: 100%; min-width: 0; font-size: 12px; } }
.jnote { border: 1px solid var(--diabetes); border-left-width: 4px; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; background: var(--surface); }
.jnote strong { color: var(--diabetes); }
.jnote p { margin: 4px 0 0; max-width: 75ch; }

:lang(zh-Hans) .mast .rx, :lang(zh-Hant) .mast .rx, :lang(th) .mast .rx, :lang(zh-Hans) .fact dt, :lang(zh-Hant) .fact dt, :lang(th) .fact dt { letter-spacing: .04em; }

/* ===== Editorial theme: black site bar, square white cards on grey, serif headings, solid icon squares ===== */
:root { --accent: #A3191F; --band: #3F2D4A; --link: #00788A;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, "PingFang SC", "PingFang TC", "Hiragino Sans GB", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK SC", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --mono: var(--body); }
:root[data-theme="dark"] { --link: #5CC8D8; --accent: #FF8086; --band: #2A2033; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --link: #5CC8D8; --accent: #FF8086; --band: #2A2033; } }

h1, h2, h3 { font-weight: 600; letter-spacing: 0; }
.wrap { max-width: 1040px; padding-top: 22px; }

/* site bar */

  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }

#sitebar .topbar-end { flex-wrap: nowrap; gap: 0 22px; }
#sitebar .nav { background: none; padding: 0; gap: 0; border-radius: 0; }
#sitebar .nav a { color: #fff; font-weight: 400; font-size: 17px; padding: 4px 18px; border-radius: 0; box-shadow: none; background: none; }
#sitebar .nav a + a { border-left: 1px solid rgb(255 255 255 / .55); }
#sitebar .nav a span { color: rgb(255 255 255 / .6); font-size: 13px; display: inline-block; }
#sitebar .nav a:hover, #sitebar .nav a[aria-current="page"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
#sitebar .langsel { color: rgb(255 255 255 / .75); }
#sitebar .langsel select { background: #000; color: #fff; border: 1px solid rgb(255 255 255 / .4); border-radius: 0; }
#sitebar :focus-visible { outline-color: #fff; }
@media (max-width: 640px) {
  #sitebar .topbar { flex-wrap: wrap; padding-bottom: 8px; }
  #sitebar .brand { font-size: 16px; padding: 10px 12px; gap: 8px; }
  #sitebar .brand svg { width: 28px; height: 28px; }
  #sitebar .langsel { margin-left: auto; align-self: center; }
  #sitebar .langsel svg { display: none; }
  #sitebar .langsel select { font-size: 13px; padding: 5px 4px; }
  #sitebar .nav a { font-size: 16px; padding: 6px 0; }
  #sitebar .nav a + a { padding-left: 16px; margin-left: 16px; }
  #sitebar .nav a { flex: 0 0 auto; }
}

/* square corners everywhere */
.hero, .label, .tab, .search, .select, .notice, .alert, .jnote, .rel a, .btn, .row, .prow, .note { border-radius: 0; }
.fchip, .citychip, .chip, .pill, .vstat, .sb { border-radius: 2px; }

/* hero: label tag + serif heading with a rule */
.mast .rx.tag { position: absolute; top: 0; left: 0; max-width: none; background: var(--accent); color: var(--surface);
  padding: 9px 18px; font-size: 13px; font-weight: 600; letter-spacing: .1em; }
.mast h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 600; letter-spacing: -.005em; padding-bottom: 12px;
  border-bottom: 1px solid color-mix(in srgb, var(--ink) 60%, transparent); }
.mast p { color: var(--ink); font-size: 17px; }

/* condition tabs as cards with a solid icon square */
.tabs { gap: 10px; }
.tab { flex-direction: row; align-items: center; gap: 14px; padding: 14px; border: 0; box-shadow: none; }
.tab .ico { flex: none; width: 52px; height: 52px; display: grid; place-items: center; background: var(--c, var(--accent)); color: var(--surface); }
.tab .ico .sym { width: 26px; height: 26px; }
.tab .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tab .t { font-size: 21px; font-weight: 600; }
.tab .n { font-size: 13.5px; }
.tab:hover { box-shadow: inset 0 0 0 1px var(--line); }
.tab[aria-pressed="true"] { box-shadow: inset 0 -4px 0 var(--c, var(--accent)); }
@media (max-width: 560px) { .tab { gap: 10px; padding: 10px; } .tab .ico { width: 40px; height: 40px; } .tab .ico .sym { width: 22px; height: 22px; } .tab .t { font-size: 18px; } }

/* lists and cards */
.cond-h h2 { font-size: 28px; }
.grp-h { font-size: 12.5px; font-weight: 600; }
.rows, .plist-wrap { background: var(--surface); }
.row, .prow { padding-left: 14px; padding-right: 14px; }
.label { border: 0; }
.label h1 { font-weight: 600; }
.fact dt, .eyebrow, .about h3 { font-weight: 600; }
.src a, .about a, .vbox a, .notice a, .jnote a, .legend a { color: var(--link); }
.citychip { font-weight: 500; }
.citychip[aria-current="page"], .citychip[aria-current="page"] .n, .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.jnote { border-color: var(--band); }
.jnote strong { color: var(--band); font-family: var(--display); font-size: 18px; }
:root[data-theme="dark"] .jnote, :root[data-theme="dark"] .jnote strong { border-color: #B79BC7; color: #D9C6E3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .jnote { border-color: #B79BC7; } :root:not([data-theme="light"]) .jnote strong { color: #D9C6E3; } }

/* footer band */
footer { max-width: none; border: 0; background: var(--band); color: rgb(255 255 255 / .85); padding: 22px 26px; font-size: 14px; }
footer a { color: #fff; font-weight: 600; }
</style>

<header id="sitebar"></header>
<div class="wrap">
  <main id="app"></main>
  <footer id="footer"></footer>
</div>

<script>
const DRUGS = __DATA__;
const PROVIDERS = __PROVIDERS__;
const CITYDOC = __CITIES__;
const RELEASE = __RELEASE__;
const I18N = __I18N__;
const REPO = "https://github.com/nr1webdevelopment/pocket-formulary";

/* ---------------- language ---------------- */
const LANGS = [["en", "English"], ["zh-Hans", "简体中文"], ["zh-Hant", "繁體中文"], ["es", "Español"], ["pt", "Português"], ["th", "ไทย"]];
const LOCALE = { en: "en-GB", "zh-Hans": "zh-CN", "zh-Hant": "zh-TW", es: "es-ES", pt: "pt-PT", th: "th-TH" };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function pickLang() {
  const ok = l => LANGS.some(x => x[0] === l);
  const q = new URLSearchParams(location.search).get("lang");
  if (ok(q)) return q;
  const s = store.get("pf-lang");
  if (ok(s)) return s;
  for (const n of (navigator.languages || [navigator.language || "en"])) {
    const l = String(n).toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(l)) return "zh-Hant";
    if (l.startsWith("zh")) return "zh-Hans";
    for (const c of ["es", "pt", "th", "en"]) if (l.startsWith(c)) return c;
  }
  return "en";
}
let LANG = pickLang();
const t = (k, vars = {}) => {
  const e = I18N.ui[k] || {};
  let s = e[LANG] != null && e[LANG] !== "" ? e[LANG] : (e.en != null ? e.en : k);
  for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b);
  return s;
};
const tc = s => (s == null || LANG === "en") ? s : ((I18N.content[LANG] || {})[s] ?? s);
function setLang(l) {
  LANG = l; store.set("pf-lang", l);
  document.documentElement.lang = l;
  const u = new URL(location.href); u.searchParams.set("lang", l);
  history.replaceState(null, "", u.pathname + u.search + u.hash);
  route();
}
document.documentElement.lang = LANG;
document.addEventListener("change", e => { if (e.target && e.target.id === "lang") setLang(e.target.value); });

/* ---------------- shared helpers ---------------- */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cvar = c => `--c: var(--${c})`;
const fmtDate = a => {
  if (!a) return "—";
  if (a.length === 4) return a;
  try { return new Intl.DateTimeFormat(LOCALE[LANG], { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" }).format(new Date(a + "T00:00:00Z")); }
  catch (e) { return a; }
};
const scrollMem = { med: 0, prov: 0 };
const SYM = {
  ribbon: '<svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c-2.3 0-3.8 1.7-3.8 3.8 0 1.7.8 3.4 2 5.2L4.8 20l2.3 1.5 4.9-7.6 4.9 7.6 2.3-1.5-5.4-8.5c1.2-1.8 2-3.5 2-5.2 0-2.1-1.5-3.8-3.8-3.8zm0 2.1c1 0 1.7.7 1.7 1.8 0 1-.6 2.3-1.7 3.8-1.1-1.5-1.7-2.8-1.7-3.8 0-1.1.7-1.8 1.7-1.8z"/></svg>',
  brain: '<svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.6C11.3 4.1 9 3.6 7.8 5 5.9 4.8 4.5 6.6 5.2 8.4 3.6 9.2 3.4 11.8 5 12.8 4.1 14.6 5.3 16.8 7.3 16.7 7.8 18.8 10.4 19.7 12 18.2"/><path d="M7.6 10.6c1.4 0 2.4.9 2.4 2.2"/></g><g transform="matrix(-1 0 0 1 24 0)"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.6C11.3 4.1 9 3.6 7.8 5 5.9 4.8 4.5 6.6 5.2 8.4 3.6 9.2 3.4 11.8 5 12.8 4.1 14.6 5.3 16.8 7.3 16.7 7.8 18.8 10.4 19.7 12 18.2"/><path d="M7.6 10.6c1.4 0 2.4.9 2.4 2.2"/></g></g><path d="M12 5.6v12.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  circle: '<svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>',
  all: '<svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 12h8M8 15h5" stroke="currentColor" stroke-width="2"/></svg>',
};
const COND = {
  hiv: { key: "condHiv", sym: "ribbon", blurb: "blurbHiv" },
  adhd: { key: "condAdhd", sym: "brain", blurb: "blurbAdhd" },
  diabetes: { key: "condDiabetes", sym: "circle", blurb: "blurbDiabetes" },
};
const condName = c => t(COND[c].key);

const HERO_CLASS = "__HERO_CLASS__";
const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#A3191F"/><path d="M16 5.5c-4.4 0-8 3.4-8 7.8 0 5.6 8 13.2 8 13.2s8-7.6 8-13.2c0-4.4-3.6-7.8-8-7.8z" fill="#fff"/><g transform="translate(16 13.2) rotate(-40)"><rect x="-5.2" y="-2.3" width="10.4" height="4.6" rx="2.3" fill="#A3191F"/><path d="M0 -2.3H-2.9A2.3 2.3 0 0 0 -2.9 2.3H0Z" fill="#F7C6C8"/></g></svg>';
function topbar(active) {
  document.getElementById("sitebar").innerHTML = `<div class="topbar">
    <a class="brand" href="#medicines" aria-label="NomadCeuticals">${LOGO}<span>NomadCeuticals</span></a>
    <div class="topbar-end">
    <nav class="nav" aria-label="Sections">
      <a href="#medicines" ${active === "med" ? 'aria-current="page"' : ""}>${t("navMedicines")}<span>${DRUGS.length}</span></a>
      <a href="#providers" ${active === "prov" ? 'aria-current="page"' : ""}>${t("navProviders")}<span>${PROVIDERS.length}</span></a>
    </nav>
    <label class="langsel"><span class="sr">${t("language")}</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <select id="lang" aria-label="${t("language")}">${LANGS.map(([c, n]) => `<option value="${c}" ${c === LANG ? "selected" : ""}>${n}</option>`).join("")}</select>
    </label>
    </div>
  </div>`;
  return "";
}

function renderFooter() {
  const f = document.getElementById("footer");
  f.innerHTML = `${esc(t("footer"))}${LANG !== "en" ? `<br><em>${esc(t("machineNote"))}</em>` : ""}
    <br>${esc(t("releaseLine", { v: RELEASE.version, date: fmtDate(RELEASE.released) }))} <a href="${REPO}#download-the-latest-data">${esc(t("downloadData"))}</a>.`;
}

/* ---------------- medicines ---------------- */
const BY = Object.fromEntries(DRUGS.map(d => [d.slug, d]));
const state = { cond: "all", q: "", hideDisc: false };
const isNew = d => d.approved.startsWith("2026");

function shell() {
  const counts = { all: DRUGS.length };
  for (const k in COND) counts[k] = DRUGS.filter(d => d.condition === k).length;
  const tab = (k, name, sym) => `<button class="tab" data-cond="${k}" aria-pressed="${state.cond === k}" style="${k === "all" ? "" : cvar(k)}">
      <span class="ico" aria-hidden="true">${SYM[sym]}</span>
      <span class="tx"><span class="t">${name}</span><span class="n">${t("nMedicines", { n: counts[k] })}</span></span></button>`;
  app.innerHTML = `
    ${topbar("med")}
    <header class="mast hero${HERO_CLASS}">
      <span class="rx tag">${t("medRx")}</span>
      <div class="hero-txt">
      <h1>${t("siteTitle")}</h1>
      <p>${t("medIntro")}</p>
      </div>
      <div class="hero-img" aria-hidden="true"></div>
    </header>
    <div class="tabs" role="group">
      ${tab("all", t("condAll"), "all")}${Object.entries(COND).map(([k, c]) => tab(k, t(c.key), c.sym)).join("")}
    </div>
    <div class="tools">
      <input id="q" class="search" type="search" placeholder="${esc(t("searchMeds"))}" aria-label="${esc(t("searchMeds"))}" value="${esc(state.q)}">
      <label class="check"><input id="hide-disc" type="checkbox" ${state.hideDisc ? "checked" : ""}> ${t("hideDisc")}</label>
    </div>
    <p class="blurb" id="blurb"></p>
    <div id="list"></div>`;
  app.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    state.cond = b.dataset.cond;
    app.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderList();
  }));
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value; renderList(); });
  document.getElementById("hide-disc").addEventListener("change", e => { state.hideDisc = e.target.checked; renderList(); });
  renderList();
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  const hay = d => [d.brand, d.generic, d.cls, d.group, d.mfr, tc(d.cls), tc(d.group), ...(d.extra || []).map(e => e[1])].join(" ").toLowerCase();
  const hit = DRUGS.filter(d =>
    (state.cond === "all" || d.condition === state.cond) &&
    (!state.hideDisc || d.status !== "Discontinued") && (!q || hay(d).includes(q)));
  document.getElementById("blurb").textContent = state.cond === "all" ? t("blurbAll") : t(COND[state.cond].blurb);
  let html = "";
  for (const [k, c] of Object.entries(COND)) {
    const items = hit.filter(d => d.condition === k);
    if (!items.length) continue;
    const groups = [...new Set(items.map(d => d.group))];
    html += `<section class="cond-block" style="${cvar(k)}">
      <div class="cond-h">${SYM[c.sym]}<h2>${t(c.key)}</h2><span class="n">${items.length}</span></div>
      ${groups.map(g => {
        const gi = items.filter(d => d.group === g).sort((a, b) => a.brand.localeCompare(b.brand));
        return `<div class="grp-h"><span>${esc(tc(g))}</span><span>· ${gi.length}</span></div><div class="rows">${gi.map(row).join("")}</div>`;
      }).join("")}
    </section>`;
  }
  document.getElementById("list").innerHTML = html || `<p class="empty">${esc(t("noMedMatch", { q: state.q }))}</p>`;
}

function row(d) {
  const pills = (d.status === "Discontinued" ? `<span class="pill disc">${t("pillDisc")}</span>` : "") + (isNew(d) ? `<span class="pill new">${t("pillNew")}</span>` : "");
  return `<a class="row" href="#${d.slug}"><span class="nm"><b>${esc(d.brand)}</b><span class="gen">${esc(d.generic)}</span></span>
    <span class="cls">${esc(tc(d.cls))}</span><span class="yr">${pills}${d.approved.slice(0, 4)}</span></a>`;
}

function profile(d) {
  const c = COND[d.condition];
  const facts = [
    [t("factClass"), tc(d.cls)], [t("factCategory"), tc(d.group)], [t("factForm"), tc(d.form)], [t("factRoute"), tc(d.route)],
    [t("factDosing"), tc(d.dosing)], [t("factMfr"), d.mfr], [t("factApproved"), fmtDate(d.approved)], [t("factStatus"), tc(d.status)],
    ...(d.extra || []).map(([k, v]) => [tc(k), tc(v)]),
  ];
  if (facts.length % 2) facts.push([t("factCondition"), t(c.key)]);
  const related = DRUGS.filter(x => x.condition === d.condition && x.group === d.group && x.slug !== d.slug);
  app.innerHTML = `
    ${topbar("med")}
    <button class="back" id="back">${t("backMeds")}</button>
    <article class="label" style="${cvar(d.condition)}">
      <div class="label-top">
        <span class="eyebrow">${SYM[c.sym]}${t(c.key)} · ${esc(tc(d.group))}</span>
        <h1>${esc(d.brand)}</h1>
        <div class="generic">${esc(d.generic)}</div>
        <div class="chips">
          ${d.status === "Discontinued" ? `<span class="pill disc">${t("brandDisc")}</span>` : ""}
          ${isNew(d) ? `<span class="pill new" style="color:var(--c)">${t("new2026")}</span>` : ""}
        </div>
      </div>
      <dl class="facts">${facts.map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v || "—")}</dd></div>`).join("")}</dl>
      <div class="about">
        <div><h3>${t("about")}</h3><p>${esc(tc(d.desc))}</p></div>
        ${d.notes ? `<div class="note"><strong>${t("noteLabel")}</strong> ${esc(tc(d.notes))}</div>` : ""}
      </div>
    </article>
    ${whereToGet(d)}
    ${related.length ? `<section class="related" style="${cvar(d.condition)}"><h3>${t("sameCategory")}</h3>
      <div class="rel">${related.map(r => `<a href="#${r.slug}">${esc(r.brand)} <span>${esc(r.generic)}</span></a>`).join("")}</div></section>` : ""}
    <p class="src">${t("sourceLabel")} <a href="${esc(d.source)}" target="_blank" rel="noopener">${esc(d.sourceName)}</a></p>`;
  document.getElementById("back").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); route(); });
  window.scrollTo(0, 0);
}

/* ---------------- providers ---------------- */
const CITIES = Object.fromEntries(CITYDOC.cities.map(c => [c.code, c]));
const REGIONS = [["regionAsia", ["bkk", "sha", "hkg", "mfm", "tpe", "sin"]], ["regionAmericas", ["sfo", "lax", "gdl"]], ["regionEurope", ["lis"]]];
const JNOTES = CITYDOC.jurisdictionNotes || {};
const PBY = Object.fromEntries(PROVIDERS.map(p => [p.id, p]));
const SVC = {
  hivTesting: "hiv", prep: "hiv", pep: "hiv", art: "hiv", stiTesting: "hiv", genderAffirmingHormones: "hiv",
  adhdAssessmentChildren: "adhd", adhdAssessmentAdults: "adhd", adhdMedication: "adhd",
  diabetesCare: "diabetes", diabetesCareChildren: "diabetes", endocrinologist: "diabetes", insulinPump: "diabetes", cgm: "diabetes", diabetesEducation: "diabetes", diabeticFootCare: "diabetes",
};
const svcLabel = k => t("svc_" + k);
const svcFilter = k => (I18N.ui["f_" + k] ? t("f_" + k) : svcLabel(k));
const svcShort = k => (I18N.ui["s_" + k] ? t("s_" + k) : svcLabel(k));
const PCOND = {
  hiv: { filter: ["hivTesting", "prep", "pep", "art", "genderAffirmingHormones"], row: ["hivTesting", "prep", "pep", "art"] },
  adhd: { filter: ["adhdAssessmentChildren", "adhdAssessmentAdults", "adhdMedication"], row: ["adhdAssessmentChildren", "adhdAssessmentAdults", "adhdMedication"] },
  diabetes: { filter: ["diabetesCare", "diabetesCareChildren", "insulinPump", "cgm", "diabetesEducation", "diabeticFootCare"], row: ["diabetesCare", "diabetesCareChildren", "insulinPump", "cgm"] },
};
const AREAS = ["Central Bangkok", "North Bangkok", "South Bangkok", "East Bangkok", "North Thonburi", "South Thonburi"];
const pstate = { city: CITIES[store.get("pf-city")] ? store.get("pf-city") : "bkk", cond: "hiv", svc: new Set(), focus: "any", q: "" };
const inCity = (c, city = pstate.city) => PROVIDERS.filter(p => p.city === city && p.conditions.includes(c));
const isPublic = p => ["government_national", "government_regional", "government_local", "government_bma", "red_cross", "university", "ngo"].includes(p.operator);
const cityName = code => { const c = CITIES[code]; return c.name[LANG] || tc(c.name.en) || c.name.en; };
const jurisdictionFor = code => Object.values(JNOTES).find(j => j.cities.includes(code));
const vpill = p => `<span class="vstat ${p.verification.status}">${t("vstat_" + p.verification.status)}</span>`;
const cleanEn = p => p.network ? p.name.en.replace(/ — BKK Pride Clinic$/, "") : p.name.en;
const cleanLocal = s => (s || "").replace(/ \(BKK Pride Clinic\)$/, "");
function pname(p) { return cleanLocal(p.name[LANG]) || tc(cleanEn(p)) || cleanEn(p); }
function pname2(p) {
  const prim = pname(p), city = CITIES[p.city];
  for (const l of [...city.localLanguages, "en"]) {
    const v = l === "en" ? cleanEn(p) : cleanLocal(p.name[l]);
    if (v && v !== prim) return v;
  }
  return "";
}
function tel(ph, cityCode) {
  let n = ph.split(/\s*ext|,/i)[0].trim();
  if (/^1800/.test(n.replace(/\s/g, ""))) return n.replace(/\D/g, "");
  n = n.replace(/-\d+$/, "");
  const d = n.replace(/\D/g, "");
  if (n.startsWith("+")) return "+" + d;
  if (d.length <= 5) return d;
  return CITIES[cityCode].dialCode + d.replace(/^0/, "");
}
const where = p => p.location.district || tc(p.location.area) || cityName(p.city);

function providerShell() {
  const c = pstate.cond, city = CITIES[pstate.city], list = inCity(c);
  const nVer = list.filter(p => p.verification.status === "verified").length;
  const jn = jurisdictionFor(pstate.city);
  const note = city.notes[c], noteSrc = (city.noteSources || {})[c];
  const ptab = k => `<button class="tab" data-pcond="${k}" aria-pressed="${c === k}" style="${cvar(k)}">
      <span class="ico" aria-hidden="true">${SYM[COND[k].sym]}</span>
      <span class="tx"><span class="t">${condName(k)}</span><span class="n">${t("nProviders", { n: inCity(k).length })}</span></span></button>`;
  app.innerHTML = `
    ${topbar("prov")}
    <header class="mast hero${HERO_CLASS}">
      <span class="rx tag">${t("provRx", { n: CITYDOC.cities.length })}</span>
      <div class="hero-txt">
      <h1>${t("siteTitle")}</h1>
      <p>${t("provIntro")}</p>
      </div>
      <div class="hero-img" aria-hidden="true"></div>
    </header>
    <nav class="citybar" aria-label="${esc(t("cityLabel"))}">
      <div class="citylabel">${t("cityLabel")}</div>
      ${REGIONS.map(([rk, codes]) => `<div class="cityregion"><span class="rlabel">${esc(t(rk))}</span>${codes.filter(x => CITIES[x]).map(x =>
        `<a class="citychip" href="#providers/${x}/${pstate.cond}" ${x === pstate.city ? 'aria-current="page"' : ""} title="${esc(tc(CITIES[x].countryName))}">${esc(cityName(x))}<span class="n">${PROVIDERS.filter(p => p.city === x).length}</span></a>`).join("")}</div>`).join("")}
    </nav>
    <div class="tabs" role="group" style="grid-template-columns: repeat(3, minmax(0, 1fr))">${Object.keys(PCOND).map(ptab).join("")}</div>
    ${jn ? `<div class="jnote" role="note"><strong>${t("jurisdictionTitle")}</strong><p>${esc(tc(jn.text))}</p></div>` : ""}
    ${c === "hiv" ? `<div class="alert" role="note"><strong>${t("pepTitle")}</strong><p>${t("pepBody")}</p>
      <button class="btn" id="show-pep" style="--c: var(--alert)">${t("pepButton")}</button></div>` : ""}
    ${note ? `<div class="notice" style="background:var(--soft)"><strong>${esc(t("cityNoteTitle", { cond: condName(c), city: cityName(pstate.city) }))}</strong>
      <p style="margin:4px 0 0">${esc(tc(note))}${noteSrc ? ` <a href="${esc(noteSrc)}" target="_blank" rel="noopener">${t("sourceLabel").replace(/[:：]$/, "")}</a>` : ""}</p></div>` : ""}
    ${list.length ? `<p class="notice">${nVer === 0
      ? `<strong>${t("noneVerified", { n: list.length })}</strong> ${t("noneVerifiedBody")}`
      : `<strong>${t("someVerified", { v: nVer, n: list.length })}</strong> ${t("someVerifiedBody")}`}</p>` : ""}
    <div class="tools">
      <input id="pq" class="search" type="search" placeholder="${esc(t("searchProv"))}" aria-label="${esc(t("searchProv"))}" value="${esc(pstate.q)}">
      ${c === "hiv" ? `<select id="focus" class="select" aria-label="${esc(t("anyFocus"))}">
        <option value="any">${t("anyFocus")}</option>
        ${["lgbtqia", "msm", "transgender", "sex_workers", "people_who_use_drugs", "migrants", "youth"].map(k => `<option value="${k}" ${pstate.focus === k ? "selected" : ""}>${esc(t("focusPrefix", { x: t("focus_" + k) }))}</option>`).join("")}
      </select>` : ""}
    </div>
    <div class="svc-filter" role="group">
      ${PCOND[c].filter.map(k => `<button class="fchip" data-svc="${k}" aria-pressed="${pstate.svc.has(k)}">${esc(svcFilter(k))}</button>`).join("")}
    </div>
    <p class="legend"><span><span class="sb solid">${esc(svcShort(PCOND[c].row[0]))}</span> ${t("legendSite")}</span><span><span class="sb net">${esc(svcShort(PCOND[c].row[0]))}</span> ${t("legendOther")}</span></p>
    <div id="plist"></div>`;
  app.querySelectorAll("[data-pcond]").forEach(b => b.addEventListener("click", () => { location.hash = `providers/${pstate.city}/${b.dataset.pcond}`; }));
  app.querySelectorAll(".fchip").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.svc;
    pstate.svc.has(k) ? pstate.svc.delete(k) : pstate.svc.add(k);
    b.setAttribute("aria-pressed", pstate.svc.has(k));
    renderProviders();
  }));
  const pep = document.getElementById("show-pep");
  if (pep) pep.addEventListener("click", () => {
    pstate.svc = new Set(["pep"]);
    app.querySelectorAll(".fchip").forEach(x => x.setAttribute("aria-pressed", x.dataset.svc === "pep"));
    renderProviders();
    document.getElementById("plist").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  const q = document.getElementById("pq");
  q.addEventListener("input", () => { pstate.q = q.value; renderProviders(); });
  const f = document.getElementById("focus");
  if (f) f.addEventListener("change", e => { pstate.focus = e.target.value; renderProviders(); });
  renderProviders();
}

function renderProviders() {
  const c = pstate.cond, q = pstate.q.trim().toLowerCase();
  const all = inCity(c);
  const hay = p => [p.name.en, ...Object.values(p.name), pname(p), p.organization, tc(p.organization), p.network, p.location.district, p.location.area, tc(p.location.area),
    ...Object.values(p.location.address || {})].filter(Boolean).join(" ").toLowerCase();
  const hit = all.filter(p => [...pstate.svc].every(k => p.services[k] === true) &&
    (c !== "hiv" || pstate.focus === "any" || p.populationFocus.includes(pstate.focus)) && (!q || hay(p).includes(q)));
  const byName = (a, b) => pname(a).localeCompare(pname(b), LOCALE[LANG]);
  const block = (title, items, blurb = "") => items.length ? `<section class="cond-block" style="--c: var(--prov)">
      <div class="cond-h"><h2>${esc(title)}</h2><span class="n">${items.length}</span></div>${blurb}
      <div class="rows" style="margin-top:6px">${items.sort(byName).map(prow).join("")}</div></section>` : "";
  let html = "";
  const networks = [...new Set(hit.filter(p => p.network).map(p => p.network))];
  if (networks.length) {
    html += block(t("groupClinics"), hit.filter(p => !p.network));
    for (const nw of networks) {
      const net = hit.filter(p => p.network === nw);
      const areas = [...new Set([...AREAS, ...net.map(p => p.location.area)])].filter(a => net.some(p => p.location.area === a));
      html += `<section class="cond-block" style="--c: var(--prov)">
        <div class="cond-h"><h2>${esc(t("groupNetwork", { network: nw }))}</h2><span class="n">${net.length}</span></div>
        ${nw === "BKK Pride Clinic" ? `<p class="blurb">${t("networkBlurbBkk")}</p>` : ""}
        ${areas.map(a => {
          const items = net.filter(p => p.location.area === a).sort(byName);
          return `<div class="grp-h"><span>${esc(tc(a) || "")}</span><span>· ${items.length}</span></div><div class="rows">${items.map(prow).join("")}</div>`;
        }).join("")}</section>`;
    }
  } else {
    html += block(t("groupPublic"), hit.filter(isPublic), `<p class="blurb">${t("groupPublicBlurb")}</p>`);
    html += block(t("groupPrivate"), hit.filter(p => !isPublic(p)));
  }
  const empty = all.length ? t("noProvMatch") : t("noProvCity", { cond: condName(c), city: cityName(pstate.city) });
  document.getElementById("plist").innerHTML = html || `<p class="empty">${esc(empty)}</p>`;
}

function prow(p) {
  const badges = PCOND[pstate.cond].row.filter(k => p.services[k] === true)
    .map(k => `<span class="sb ${p.services.basis === "site" ? "solid" : "net"}" title="${esc(svcLabel(k))}">${esc(svcShort(k))}</span>`).join("");
  const sub = p.network ? (tc(p.location.locationNote) || t("type_" + p.type)) : `${t("type_" + p.type)} · ${where(p)}`;
  const n2 = pname2(p);
  return `<a class="prow" href="#provider/${p.id}">
    <span class="nm"><b>${esc(pname(p))}</b>${n2 ? `<span class="th">${esc(n2)}</span>` : ""}</span>
    <span class="where">${esc(sub)}</span>
    <span class="badges">${badges}${vpill(p)}</span></a>`;
}

function providerProfile(p) {
  const s = p.services, L = p.location, C = p.contact, city = CITIES[p.city];
  const main = p.conditions.includes(pstate.cond) ? pstate.cond : p.conditions[0];
  const svcItem = k => {
    const v = s[k];
    const [cls, ic, txt] = v === true ? (s.basis === "site" ? ["yes", "✓", t("svcSite")] : s.basis === "network" ? ["net", "✓", t("svcNetwork")] : ["net", "✓", t("svcThird")])
      : v === false ? ["no", "✕", t("svcNo")] : ["unk", "?", t("svcUnknown")];
    return `<li><span class="ic ${cls}" aria-hidden="true">${ic}</span><span><b>${esc(svcLabel(k))}</b><small>${esc(txt)}</small></span></li>`;
  };
  const svcKeys = Object.keys(SVC).filter(k => p.conditions.includes(SVC[k]) && (k in s));
  const addrs = [...new Set([L.address[LANG], ...city.localLanguages.map(l => L.address[l]), L.address.en].filter(Boolean))];
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([cleanEn(p), L.address.en || Object.values(L.address).find(Boolean), city.name.en].filter(Boolean).join(", "));
  const yn = v => v === true ? t("yes") : v === false ? t("no") : t("notConfirmed");
  const facts = [
    [t("factAddress"), addrs.join("\n") || t("addrUnknown")],
    [t("factWhere"), tc(L.locationNote)], [t("factTransit"), tc(L.nearestTransit)],
    [t("factHours"), tc(p.hours) || t("hoursUnknown")],
    [t("factCost"), p.access.cost ? t("cost_" + p.access.cost) : t("notConfirmed")],
    [t("factFor"), p.populationFocus.map(f => t("focus_" + f)).join(", ")],
    [t("factWalkIn"), p.access.walkIn === false ? t("apptNeeded") : yn(p.access.walkIn)],
    [t("factForeigners"), yn(p.access.foreignersAccepted)],
    [t("factLanguages"), p.access.languages.join(", ") || t("notConfirmed")],
    [t("factRunBy"), p.network ? t("runByNetwork", { org: tc(p.organization), network: p.network }) : tc(p.organization)],
  ].filter(([, v]) => v);
  if (facts.length % 2) facts.push([t("factType"), t("type_" + p.type)]);
  const prepMeds = p.conditions.includes("hiv") && s.prep ? DRUGS.filter(d => (d.extra || []).some(e => e[0] === "Used for" && /PrEP/.test(e[1]))) : [];
  const issue = `${REPO}/issues/new?title=${encodeURIComponent("Correction: " + p.id)}&body=${encodeURIComponent("What's wrong or out of date?\n\n")}`;
  const n2 = pname2(p);
  app.innerHTML = `
    ${topbar("prov")}
    <a class="back" href="#providers/${p.city}/${main}">${esc(t("backProv", { cond: condName(main), city: cityName(p.city) }))}</a>
    <article class="label" style="--c: var(--prov)">
      <div class="label-top">
        <span class="eyebrow">${p.conditions.map(condName).join(" · ")} · ${esc(t("type_" + p.type))} · ${esc(cityName(p.city))}</span>
        <h1>${esc(pname(p))}</h1>
        ${n2 ? `<div class="generic">${esc(n2)}</div>` : ""}
        <div class="chips">${vpill(p)}${p.network ? `<span class="chip">${esc(p.network)}</span>` : ""}${p.access.cost ? `<span class="chip">${t("cost_" + p.access.cost)}</span>` : ""}</div>
      </div>
      <div class="actions">
        ${C.phone.map(ph => `<a class="btn" href="tel:${tel(ph, p.city)}">${esc(t("call", { phone: ph }))}</a>`).join("")}
        ${C.line ? `<a class="btn" href="https://line.me/R/ti/p/${encodeURIComponent(C.line)}" target="_blank" rel="noopener">${esc(t("lineBtn", { id: C.line }))}</a>` : ""}
        ${C.booking ? `<a class="btn" href="${esc(C.booking)}" target="_blank" rel="noopener">${t("book")}</a>` : ""}
        ${C.website ? `<a class="btn" href="${esc(C.website)}" target="_blank" rel="noopener">${t("website")}</a>` : ""}
        ${C.email ? `<a class="btn" href="mailto:${esc(C.email)}">${t("emailBtn")}</a>` : ""}
        <a class="btn" href="${maps}" target="_blank" rel="noopener">${t("directions")}</a>
      </div>
      <ul class="svc-list">${svcKeys.map(svcItem).join("")}</ul>
      <dl class="facts">${facts.map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd style="white-space:pre-line">${esc(v)}</dd></div>`).join("")}</dl>
      ${s.note || p.notes ? `<div class="about">${s.note ? `<div class="note"><strong>${t("aboutServices")}</strong> ${esc(tc(s.note))}</div>` : ""}${p.notes ? `<p>${esc(tc(p.notes))}</p>` : ""}</div>` : ""}
    </article>
    ${jurisdictionFor(p.city) ? `<div class="jnote" role="note" style="margin-top:20px"><strong>${t("jurisdictionTitle")}</strong><p>${esc(tc(jurisdictionFor(p.city).text))}</p></div>` : ""}
    ${prepMeds.length ? `<section class="related" style="--c: var(--hiv)"><h3>${t("prepMeds")}</h3>
      <div class="rel">${prepMeds.map(r => `<a href="#${r.slug}">${esc(r.brand)} <span>${esc(r.generic)}</span></a>`).join("")}</div>
      <p class="blurb">${t("prepMedsNote")}</p></section>` : ""}
    ${p.conditions.includes("adhd") ? `<section class="related"><h3>${t("adhdMeds")}</h3>
      <div class="rel"><a href="#adhd">${t("seeAllAdhd")}</a></div><p class="blurb">${t("adhdMedsNote")}</p></section>` : ""}
    ${p.conditions.includes("diabetes") ? `<section class="related"><h3>${t("dmMeds")}</h3>
      <div class="rel"><a href="#diabetes">${t("seeAllDm")}</a></div></section>` : ""}
    <div class="vbox">
      <strong>${t("verification")}</strong> ${vpill(p)}
      <dl>
        <dt>${t("sourceChecked")}</dt><dd>${fmtDate(p.verification.sourceChecked)}</dd>
        <dt>${t("confirmedWith")}</dt><dd>${p.verification.lastVerified ? esc(t("verifiedOn", { date: fmtDate(p.verification.lastVerified), method: t("method_" + p.verification.method) })) : t("notYet")}</dd>
        ${p.verification.nextReviewDue ? `<dt>${t("nextCheck")}</dt><dd>${fmtDate(p.verification.nextReviewDue)}</dd>` : ""}
      </dl>
      <a href="${issue}" target="_blank" rel="noopener">${t("report")}</a>
    </div>
    <div class="src">${t("sourcesLabel")}<ul>${p.sources.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>${x.publisher ? ` · ${esc(x.publisher)}` : ""}</li>`).join("")}</ul></div>`;
  window.scrollTo(0, 0);
}

function whereToGet(d) {
  const city = pstate.city, place = tc(CITIES[city].jurisdiction);
  const count = k => PROVIDERS.filter(p => p.city === city && p.services[k] === true).length;
  const link = (path, label, n) => `<a href="#providers/${city}/${path}">${esc(label)} <span>${n}</span></a>`;
  let links = [], note = "";
  if (d.condition === "hiv") {
    const used = ((d.extra || []).find(e => e[0] === "Used for") || [])[1] || "";
    if (/PrEP/.test(used)) links.push(link("prep", t("prepProviders"), count("prep")));
    if (/Treatment/.test(used)) links.push(link("art", t("artProviders"), count("art")));
    note = esc(t("noteHivBrands"));
  } else if (d.condition === "adhd") {
    links.push(link("adhd", t("adhdProviders"), inCity("adhd", city).length));
    const g = d.generic.toLowerCase();
    note = city === "bkk"
      ? (/lisdexamfetamine/.test(g) ? `<strong>${esc(t("thLisdex"))}</strong>` : /amphetamine/.test(g) ? `<strong>${esc(t("thAmphetamine"))}</strong>` : /^methylphenidate/.test(g) ? esc(t("thMph")) : esc(t("noteAskAvailable", { place })))
      : esc(t("noteAskAvailable", { place }));
  } else {
    links.push(link("diabetes", t("dmProviders"), inCity("diabetes", city).length));
    note = esc(t("noteAskAvailable", { place }));
  }
  if (!links.length) return "";
  return `<section class="related" style="--c: var(--prov)"><h3>${esc(t("whereCare", { city: cityName(city) }))}</h3>
    <div class="rel">${links.join("")}<a href="#providers" class="ghost">${t("changeCity")}</a></div><p class="blurb">${note}</p></section>`;
}

/* ---------------- routing ---------------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const onList = document.getElementById("list") || document.getElementById("plist");
  if (onList) scrollMem[document.getElementById("plist") ? "prov" : "med"] = window.scrollY;
  document.title = t("siteTitle");
  if (h.startsWith("provider/") && PBY[h.slice(9)]) {
    const p = PBY[h.slice(9)];
    pstate.city = p.city;
    if (!p.conditions.includes(pstate.cond)) pstate.cond = p.conditions[0];
    providerProfile(p);
  } else if (h === "providers" || h.startsWith("providers/")) {
    const segs = h.split("/").slice(1);
    let city = pstate.city, cond = pstate.cond, svc = null;
    for (const s of segs) {
      if (CITIES[s]) city = s;
      else if (PCOND[s]) cond = s;
      else if (SVC[s]) { cond = SVC[s]; svc = s; }
    }
    if (city !== pstate.city || cond !== pstate.cond || svc) { pstate.svc = new Set(svc ? [svc] : []); scrollMem.prov = 0; }
    if (city !== pstate.city) pstate.q = "";
    pstate.city = city; pstate.cond = cond; store.set("pf-city", city);
    providerShell();
    window.scrollTo(0, scrollMem.prov);
  } else if (BY[h]) {
    profile(BY[h]);
  } else {
    if (COND[h] || h === "all") state.cond = h;
    shell();
    window.scrollTo(0, scrollMem.med);
  }
  renderFooter();
}
window.addEventListener("hashchange", route);
route();
</script>
